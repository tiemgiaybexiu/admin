<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>Admin - Tiệm giày Bé Xíu</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-gray-100 text-gray-800">

    <!-- KHUNG ĐĂNG NHẬP -->
    <div id="loginSection" class="min-h-screen flex items-center justify-center px-4">
        <div class="bg-white p-8 rounded-2xl shadow-xl max-w-sm w-full text-center">
            <div class="w-20 h-20 bg-gray-100 rounded-full mx-auto flex items-center justify-center mb-4 border-4 border-gray-200">
                <i class="fas fa-lock text-3xl text-gray-400"></i>
            </div>
            <h2 class="text-2xl font-bold mb-6 text-gray-700">Quản Trị Viên</h2>
            <input type="password" id="passCode" placeholder="Nhập mã pin..." class="w-full text-center p-3 border-2 border-gray-200 rounded-xl mb-4 text-xl tracking-widest focus:border-blue-500 focus:outline-none">
            <button onclick="checkLogin()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl transition">Đăng Nhập</button>
        </div>
    </div>

    <!-- GIAO DIỆN ADMIN CHÍNH -->
    <div id="adminPanel" class="hidden max-w-5xl mx-auto pb-20">
        
        <!-- Header -->
        <div class="bg-white shadow-sm p-4 sticky top-0 z-50 border-b flex justify-between items-center">
            <div class="font-bold text-lg text-blue-800"><i class="fas fa-shoe-prints mr-2"></i> Admin Bé Xíu</div>
            <a href="index.html" class="text-sm bg-gray-100 px-3 py-1.5 rounded-lg hover:bg-gray-200 font-bold"><i class="fas fa-external-link-alt"></i> Ra trang chủ</a>
        </div>

        <!-- Điều hướng Tabs -->
        <div class="flex bg-white px-2 mt-2 gap-2 shadow-sm rounded-lg mx-2 p-1 border">
            <button onclick="switchTab('uploadTab')" id="btn-uploadTab" class="flex-1 py-2.5 text-sm font-bold bg-blue-50 text-blue-600 rounded-md transition border border-blue-200"><i class="fas fa-plus-circle mr-1"></i> Đăng Giày</button>
            <button onclick="switchTab('inventoryTab')" id="btn-inventoryTab" class="flex-1 py-2.5 text-sm font-bold text-gray-500 hover:bg-gray-50 rounded-md transition"><i class="fas fa-box mr-1"></i> Kho Hàng</button>
            <button onclick="switchTab('orderTab')" id="btn-orderTab" class="flex-1 py-2.5 text-sm font-bold text-gray-500 hover:bg-gray-50 rounded-md transition"><i class="fas fa-list-alt mr-1"></i> Đơn Hàng</button>
        </div>

        <!-- TAB 1: ĐĂNG GIÀY MỚI -->
        <div id="uploadTab" class="p-4 tab-content block">
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-200">
                <h3 class="font-bold text-lg mb-4 border-b pb-2"><i class="fas fa-upload text-blue-500"></i> Đăng Sản Phẩm Mới</h3>
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <!-- Trái: Ảnh -->
                    <div>
                        <label class="block text-sm font-semibold mb-2 text-gray-700">1. Ảnh sản phẩm:</label>
                        <div class="relative border-2 border-dashed border-pink-300 bg-pink-50 rounded-2xl p-6 flex flex-col items-center justify-center hover:bg-pink-100 transition cursor-pointer min-h-[250px]" onclick="document.getElementById('imageInput').click()">
                            <input type="file" id="imageInput" accept="image/*" class="hidden" onchange="previewImage(this)">
                            
                            <div id="uploadPrompt" class="text-center">
                                <i class="fas fa-cloud-upload-alt text-5xl text-pink-400 mb-3"></i>
                                <p class="text-sm font-bold text-pink-600">Bấm để chọn ảnh</p>
                                <p class="text-xs text-gray-500 mt-1">Ảnh sẽ tự động hiển thị vuông</p>
                            </div>
                            
                            <div id="previewContainer" class="hidden w-full h-full relative">
                                <img id="imgPreview" src="" class="w-full aspect-square object-contain bg-white rounded-xl border border-gray-200 shadow-sm p-1">
                                <button onclick="event.stopPropagation(); clearImage()" class="absolute -top-3 -right-3 bg-white text-red-500 rounded-full w-8 h-8 flex items-center justify-center shadow-md border border-gray-100 hover:bg-red-50 transition" title="Đổi ảnh khác">
                                    <i class="fas fa-times"></i>
                                </button>
                            </div>
                        </div>
                    </div>

                    <!-- Phải: Thông tin -->
                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm font-semibold mb-2 text-gray-700">2. Mã giày (Tự động):</label>
                            <div class="flex gap-2">
                                <input type="text" id="shoeCode" readonly class="w-full p-2.5 border border-gray-300 rounded-lg uppercase bg-gray-100 font-bold text-gray-600 cursor-not-allowed">
                                <button onclick="document.getElementById('shoeCode').value = generateRandomCode()" class="bg-gray-200 hover:bg-gray-300 px-4 rounded-lg transition" title="Tạo mã ngẫu nhiên mới">
                                    <i class="fas fa-sync-alt text-gray-600"></i>
                                </button>
                            </div>
                        </div>

                        <div>
                            <label class="block text-sm font-semibold mb-2 text-gray-700">3. Chọn Size:</label>
                            <div class="grid grid-cols-5 gap-1.5" id="sizeOptions">
                                <!-- JS sẽ render các nút chọn size vào đây -->
                            </div>
                        </div>

                        <div class="bg-amber-50 border border-amber-200 p-3 rounded-lg flex items-center gap-2 cursor-pointer hover:bg-amber-100 transition" onclick="toggleSpecialBrand()">
                            <input type="checkbox" id="isSpecialBrand" class="w-5 h-5 text-amber-600 rounded pointer-events-none">
                            <label class="font-bold text-sm text-amber-800 pointer-events-none">🌟 Hàng Vans/Converse (Đồng giá 350k)</label>
                        </div>

                        <div>
                            <label class="block text-sm font-semibold mb-2 text-gray-700">4. Giá tiền (Tự động):</label>
                            <div class="relative">
                                <input type="number" id="shoePrice" class="w-full p-2.5 border border-gray-300 rounded-lg font-black text-pink-600 bg-gray-100 text-lg" readonly>
                                <span class="absolute right-4 top-2.5 font-bold text-gray-400">VNĐ</span>
                            </div>
                            <p class="text-[11px] text-gray-500 mt-1.5 font-semibold">Tự động: ≤35.5 (180k) | 36 - 36.5 (230k) | ≥37 (260k)</p>
                        </div>

                        <button id="btnUpload" onclick="uploadProduct()" class="w-full bg-black hover:bg-gray-800 text-white font-bold py-3.5 rounded-xl shadow-lg transition mt-4">
                            <i class="fas fa-cloud-upload-alt mr-2"></i> Đăng Lên Web
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- TAB 2: QUẢN LÝ KHO -->
        <div id="inventoryTab" class="p-4 tab-content hidden">
            <!-- THANH CÔNG CỤ: Lọc Size & Đồng bộ Giá -->
            <div class="flex flex-col md:flex-row justify-between md:items-center bg-white p-3 rounded-xl shadow-sm border border-gray-200 mb-4 gap-3">
                <div class="flex items-center gap-2 font-bold text-gray-700">
                    <i class="fas fa-boxes text-blue-500"></i> Tổng kho: <span id="countAvailable" class="text-red-500">0</span> đôi
                </div>
                <div class="flex gap-2 w-full md:w-auto">
                    <!-- Dropdown lọc Size -->
                    <select id="filterInventorySize" onchange="loadInventory()" class="p-2 border border-gray-300 rounded-lg text-sm bg-gray-50 flex-1 md:w-auto font-semibold focus:outline-none focus:border-blue-500">
                        <option value="ALL">Lọc theo Size (Tất cả)</option>
                        <!-- Options sẽ được gen bằng JS -->
                    </select>
                    <!-- Nút Đồng bộ giá hàng loạt -->
                    <button onclick="syncAllPrices()" class="bg-yellow-500 hover:bg-yellow-600 text-white px-4 py-2 rounded-lg text-sm font-bold shadow transition whitespace-nowrap">
                        <i class="fas fa-sync-alt mr-1"></i> Đồng bộ giá
                    </button>
                </div>
            </div>

            <div id="adminProductList" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-3">
                <!-- Data load ở đây -->
            </div>
        </div>

        <!-- TAB 3: QUẢN LÝ ĐƠN HÀNG -->
        <div id="orderTab" class="p-4 tab-content hidden">
            <button onclick="testTelegramBot()" class="w-full bg-blue-100 text-blue-700 py-3 rounded-lg font-bold mb-4 border border-blue-200 active:bg-blue-200">
                <i class="fab fa-telegram-plane mr-1"></i> Test thử Bot Telegram
            </button>
            <h3 class="font-bold mb-3 text-gray-700">Lịch sử Chốt Đơn</h3>
            <div id="adminOrderList" class="space-y-3">
                <!-- Data load ở đây -->
            </div>
        </div>

    </div>

    <script>
        // FIREBASE CONFIG CŨ CỦA BẠN
        const fbP1 = "AIzaSyCVAm"; const fbP2 = "JO1KViXVg3"; const fbP3 = "kizelTp6CZ"; const fbP4 = "AFmJLkKiM";
        const firebaseConfig = {
            apiKey: fbP1 + fbP2 + fbP3 + fbP4,
            authDomain: "donggia-8ef8e.firebaseapp.com", 
            projectId: "donggia-8ef8e",
            storageBucket: "donggia-8ef8e.firebasestorage.app", 
            messagingSenderId: "186638607487",
            appId: "1:186638607487:web:9fe74d79311b0f43d70b4a"
        };
        
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // 1. CHỨC NĂNG ĐĂNG NHẬP
        function checkLogin() {
            if(document.getElementById('passCode').value === '3119') {
                document.getElementById('loginSection').classList.add('hidden');
                document.getElementById('adminPanel').classList.remove('hidden');
                initAdmin();
            } else {
                alert('Sai mật khẩu!');
            }
        }

        // Cấu hình Size
        const sizes = ['Kid','33','33.5','34','34.5','35','35.5','36','36.5','37','37.5','38','38.5','39','39.5','40+'];

        function initAdmin() {
            // Khởi tạo nút size đăng giày
            const sizeContainer = document.getElementById('sizeOptions');
            const filterSelect = document.getElementById('filterInventorySize');

            sizes.forEach(s => {
                // Gen nút radio
                let div = document.createElement('div');
                div.className = "text-center";
                div.innerHTML = `
                    <input type="radio" name="size" id="size_${s}" value="${s}" class="peer hidden" onchange="autoCalcPrice()">
                    <label for="size_${s}" class="block py-1.5 border border-gray-300 rounded cursor-pointer peer-checked:bg-blue-500 peer-checked:text-white peer-checked:border-blue-500 text-sm font-medium transition hover:bg-gray-50">${s}</label>
                `;
                sizeContainer.appendChild(div);

                // Gen lựa chọn lọc Size
                if(filterSelect.options.length <= 16) { 
                    let opt = document.createElement('option');
                    opt.value = s;
                    opt.textContent = "Chỉ lọc Size " + s;
                    filterSelect.appendChild(opt);
                }
            });
            
            // Generate mã ngẫu nhiên lần đầu
            document.getElementById('shoeCode').value = generateRandomCode();
            
            loadInventory();
            loadOrders();
        }
        
        function generateRandomCode() {
            const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ";
            const c1 = chars[Math.floor(Math.random() * chars.length)];
            const c2 = chars[Math.floor(Math.random() * chars.length)];
            const digits = String(Math.floor(100 + Math.random() * 900));
            return `${c1}${c2}${digits}`;
        }

        // 2. LOGIC TÍNH GIÁ
        function toggleSpecialBrand() {
            const cb = document.getElementById('isSpecialBrand');
            cb.checked = !cb.checked;
            autoCalcPrice();
        }

        function autoCalcPrice() {
            const isSpecial = document.getElementById('isSpecialBrand').checked;
            const sizeInput = document.querySelector('input[name="size"]:checked');
            const priceInput = document.getElementById('shoePrice');
            
            if (isSpecial) {
                priceInput.value = 350000;
                return;
            }
            
            if (sizeInput) {
                let sVal = sizeInput.value;
                let sNum = parseFloat(sVal);
                
                if (sVal === 'Kid' || sNum <= 35.5) priceInput.value = 180000;
                else if (sNum === 36 || sNum === 36.5) priceInput.value = 230000;
                else if (sNum >= 37) priceInput.value = 260000;
                else priceInput.value = 0;
            }
        }

        // 3. UPLOAD ẢNH & DATA (Tích hợp lại ImageKit của bạn)
        function previewImage(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('imgPreview').src = e.target.result;
                    document.getElementById('previewContainer').classList.remove('hidden');
                    document.getElementById('uploadPrompt').classList.add('hidden');
                }
                reader.readAsDataURL(input.files[0]);
            }
        }

        function clearImage() {
            document.getElementById('imageInput').value = '';
            document.getElementById('imgPreview').src = '';
            document.getElementById('uploadPrompt').classList.remove('hidden');
            document.getElementById('previewContainer').classList.add('hidden');
        }

        async function uploadProduct() {
            const code = document.getElementById('shoeCode').value.toUpperCase().trim();
            const sizeInput = document.querySelector('input[name="size"]:checked');
            const price = parseInt(document.getElementById('shoePrice').value);
            const imgFile = document.getElementById('imageInput').files[0];
            const btn = document.getElementById('btnUpload');

            if(!code || !sizeInput || !price || !imgFile) {
                alert('Vui lòng điền đủ Mã, Size, Giá và chọn Ảnh!');
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Đang tải lên...';

            try {
                // TÍCH HỢP LẠI IMAGEKIT CỦA BẠN
                const ikPriv1 = "ayTs6CE91Z"; const ikPriv2 = "pBtxpipgz2"; const ikPriv3 = "GmpKdjU=";
                const IK_PRIVATE_KEY = "private_" + ikPriv1 + ikPriv2 + ikPriv3;
                const IK_UPLOAD_ENDPOINT = "https://upload.imagekit.io/api/v1/files/upload";
                const IK_AUTH = "Basic " + btoa(IK_PRIVATE_KEY + ":");
                
                const formData = new FormData();
                formData.append("file", imgFile, `giay-${code}.jpg`); 
                formData.append("fileName", `giay-${code}.jpg`); 
                formData.append("folder", "/giay2hand");
                
                const res = await fetch(IK_UPLOAD_ENDPOINT, { 
                    method: "POST", 
                    headers: { "Authorization": IK_AUTH }, 
                    body: formData 
                });
                const ikData = await res.json();
                
                if (!ikData.url) throw new Error("Lỗi tải ảnh lên ImageKit");
                
                // LƯU LÊN FIREBASE
                await db.collection("products").add({
                    code: code,
                    size: sizeInput.value,
                    price: price,
                    imageUrl: ikData.url,
                    images: [ikData.url], // Ghi đúp cho tương thích cũ
                    status: 'available',
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });

                alert('✅ Đã đăng thành công!');
                
                // Reset Form
                document.getElementById('shoeCode').value = generateRandomCode();
                clearImage();
                if(sizeInput) sizeInput.checked = false;
                document.getElementById('shoePrice').value = '';
                document.getElementById('isSpecialBrand').checked = false;
                
            } catch (err) {
                console.error(err);
                alert('Lỗi: ' + err.message);
            }
            
            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-cloud-upload-alt mr-2"></i> Đăng Lên Web';
        }

        // 4. QUẢN LÝ TABS
        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.querySelectorAll('[id^="btn-"]').forEach(btn => {
                btn.className = "flex-1 py-2.5 text-sm font-bold text-gray-500 hover:bg-gray-50 rounded-md transition";
            });
            
            document.getElementById(tabId).classList.remove('hidden');
            document.getElementById('btn-' + tabId).className = "flex-1 py-2.5 text-sm font-bold bg-blue-50 text-blue-600 rounded-md transition border border-blue-200";
        }

        // Tối ưu ảnh hiển thị
        function getOptimizedImageUrl(url, width = 400) {
            if (!url) return '';
            if (url.includes('ik.imagekit.io') && !url.includes('tr=')) return `${url}?tr=w-${width},f-webp,q-85`;
            return url;
        }

        // 5. LOAD KHO HÀNG (CÓ TÍCH HỢP BỘ LỌC SIZE)
        function loadInventory() {
            const filterValue = document.getElementById('filterInventorySize') ? document.getElementById('filterInventorySize').value : 'ALL';

            db.collection("products").orderBy("createdAt", "desc").onSnapshot((snapshot) => {
                const container = document.getElementById('adminProductList');
                container.innerHTML = '';
                let availableCount = 0;

                snapshot.forEach((doc) => {
                    const data = doc.data();
                    if (data.status === 'available' || !data.status || !data.isSold) {
                        
                        // Nếu đang dùng lọc Size thì kiểm tra
                        if (filterValue !== 'ALL' && String(data.size) !== filterValue) {
                            return; // Bỏ qua đôi này vì không đúng Size cần lọc
                        }

                        availableCount++;
                        // Hỗ trợ cả 2 định dạng lưu ảnh (mới và cũ)
                        const imgUrl = data.imageUrl || (data.images && data.images[0]) || '';
                        
                        container.innerHTML += `
                            <div class="bg-white border border-gray-200 rounded-lg p-2 text-center shadow-sm relative group">
                                <img src="${getOptimizedImageUrl(imgUrl, 200)}" class="w-full aspect-square object-contain bg-gray-50 rounded mb-2 border border-gray-100">
                                <div class="font-bold text-sm text-red-600">#${data.code} <span class="text-xs text-gray-500 font-semibold ml-1">Sz ${data.size}</span></div>
                                <div class="font-bold text-xs text-gray-800">${(data.price || 0).toLocaleString('vi-VN')}đ</div>
                                <button onclick="deleteProduct('${doc.id}')" class="mt-2 text-xs w-full bg-red-50 text-red-500 hover:bg-red-500 hover:text-white py-1.5 rounded font-bold transition"><i class="fas fa-trash"></i> Xóa</button>
                            </div>
                        `;
                    }
                });
                document.getElementById('countAvailable').innerText = availableCount;
            });
        }

        function deleteProduct(id) {
            if(confirm('Chắc chắn xóa đôi này khỏi kho?')) {
                db.collection("products").doc(id).delete();
            }
        }

        // TÍNH NĂNG MỚI: ĐỒNG BỘ GIÁ HÀNG LOẠT
        async function syncAllPrices() {
            if(!confirm('Tính năng này sẽ tự động chạy qua toàn bộ Kho Hàng (chưa bán) và thiết lập lại giá chuẩn mới nhất:\n• Size <= 35.5: 180k\n• Size 36 và 36.5: 230k\n• Size >= 37: 260k\n\n(Lưu ý: Hàng Vans/Converse giá 350k sẽ được GIỮ NGUYÊN).\n\nBẠN CÓ CHẮC CHẮN MUỐN ĐỒNG BỘ KHÔNG?')) return;
            
            try {
                // Firebase cho phép tối đa 500 thao tác trong 1 batch
                const batch = db.batch(); 
                const snapshot = await db.collection("products").get();
                let updatedCount = 0;

                snapshot.forEach(doc => {
                    const data = doc.data();
                    
                    // Chỉ quét các đôi còn hàng
                    if(data.status === 'available' || !data.status || !data.isSold) {
                        let isSpecial = (data.price === 350000); // Tạm coi giá 350k là loại đặc biệt không đổi
                        
                        if(!isSpecial) {
                            let newPrice = 0;
                            let sVal = data.size;
                            let sNum = parseFloat(sVal);
                            
                            if (sVal === 'Kid' || sNum <= 35.5) newPrice = 180000;
                            else if (sNum === 36 || sNum === 36.5) newPrice = 230000;
                            else if (sNum >= 37) newPrice = 260000;
                            
                            // Nếu giá hiện tại bị sai so với chuẩn, thì cập nhật
                            if(newPrice > 0 && data.price !== newPrice) {
                                batch.update(doc.ref, { price: newPrice });
                                updatedCount++;
                            }
                        }
                    }
                });

                if(updatedCount > 0) {
                    await batch.commit();
                    alert(`✅ HOÀN TẤT!\nĐã tự động sửa lại giá cho ${updatedCount} đôi giày.`);
                    loadInventory(); // Tải lại giao diện
                } else {
                    alert('tuyệt vời! Toàn bộ tủ giày của bạn đều đang ở mức giá chuẩn, không cần đồng bộ thêm.');
                }

            } catch(error) {
                console.error("Lỗi đồng bộ giá:", error);
                alert("Lỗi khi đồng bộ giá: " + error.message);
            }
        }


        // 6. LOAD ĐƠN HÀNG 
        function loadOrders() {
            db.collection("orders").orderBy("timestamp", "desc").limit(30).onSnapshot(snapshot => {
                const container = document.getElementById('adminOrderList');
                container.innerHTML = '';
                snapshot.forEach(doc => {
                    const data = doc.data();
                    const date = data.timestamp ? data.timestamp.toDate().toLocaleString('vi-VN') : 'Mới';
                    container.innerHTML += `
                        <div class="bg-white p-3 rounded-xl border border-gray-200 shadow-sm flex flex-col md:flex-row justify-between gap-2">
                            <div>
                                <span class="bg-yellow-100 text-yellow-800 text-xs px-2 py-0.5 rounded font-bold mb-1 inline-block">${date}</span>
                                <div class="font-bold text-gray-800 text-sm">👤 ${data.customerName} - 📞 ${data.customerPhone}</div>
                                <div class="text-sm text-gray-600 mt-0.5">📍 ${data.address}</div>
                                <div class="text-sm font-semibold text-red-600 mt-1">👟 ${data.productCode} (Size ${data.size}) - ${(data.price || 0).toLocaleString('vi-VN')}đ</div>
                            </div>
                            <div class="flex items-center">
                                <button onclick="deleteOrder('${doc.id}')" class="bg-red-50 text-red-500 px-3 py-1.5 rounded text-sm hover:bg-red-100 w-full md:w-auto font-bold"><i class="fas fa-trash"></i> Xóa</button>
                            </div>
                        </div>
                    `;
                });
            });
        }

        function deleteOrder(id) {
            if(confirm('Xóa thông tin đơn hàng này?')) {
                db.collection("orders").doc(id).delete();
            }
        }

        // Hàm Test Telegram
        function testTelegramBot() {
            const token = "8968912621:AAFKK2PQuPNqWLLer4_wkZf6PtY1ZzHV9RI";
            const id = "8511070091";
            fetch(`https://api.telegram.org/bot${token}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chat_id: id, text: "✅ Test thành công! Bot đã kết nối với Web Bé Xíu." })
            }).then(res => {
                if(res.ok) alert('✅ Đã gửi tin nhắn test! Bạn mở ứng dụng Telegram xem có nhận được chưa.');
                else alert('❌ Gửi lỗi! Bạn nhớ mở ứng dụng Telegram và bấm /start với con Bot của bạn chưa?');
            });
        }
    </script>
