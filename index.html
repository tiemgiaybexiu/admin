<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Admin - Tiệm giày Bé Xíu</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: { fontFamily: { sans: ['Inter', 'sans-serif'] } }
            }
        }
    </script>
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .bulk-cb { width: 22px; height: 22px; cursor: pointer; accent-color: #ec4899; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 pb-20">

    <!-- Custom Confirm / Alert Dialog -->
    <div id="customDialog" class="fixed inset-0 bg-black/60 z-[200] hidden flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white rounded-2xl w-full max-w-sm p-6 shadow-2xl text-center">
            <h3 id="dialogMessage" class="text-gray-800 font-bold text-sm mb-6">Message</h3>
            <div id="dialogButtons" class="flex gap-3 justify-center"></div>
        </div>
    </div>

    <!-- KHUNG ĐĂNG NHẬP -->
    <div id="loginSection" class="min-h-screen flex items-center justify-center px-4 bg-gray-100">
        <div class="bg-white p-8 rounded-2xl shadow-xl max-w-sm w-full text-center">
            <div class="w-20 h-20 bg-pink-50 rounded-full mx-auto flex items-center justify-center mb-4 border-4 border-pink-100">
                <i class="fas fa-lock text-3xl text-pink-400"></i>
            </div>
            <h2 class="text-2xl font-bold mb-6 text-gray-700">Quản Trị Viên</h2>
            <input type="password" id="passCode" placeholder="Nhập mã pin..." class="w-full text-center p-3 border-2 border-gray-200 rounded-xl mb-4 text-xl tracking-widest focus:border-pink-500 focus:outline-none">
            <button onclick="checkLogin()" class="w-full bg-pink-600 hover:bg-pink-700 text-white font-bold py-3 rounded-xl transition shadow-md">Đăng Nhập</button>
        </div>
    </div>

    <!-- GIAO DIỆN ADMIN CHÍNH -->
    <div id="adminPanel" class="hidden max-w-5xl mx-auto">
        
        <!-- Header -->
        <div class="bg-white shadow-sm p-4 sticky top-0 z-40 border-b flex justify-between items-center">
            <div class="font-black text-lg text-pink-600"><i class="fas fa-shoe-prints mr-2"></i>Bé Xíu Admin</div>
            <a href="index.html" target="_blank" class="text-xs bg-gray-100 font-bold px-3 py-2 rounded-lg hover:bg-gray-200"><i class="fas fa-external-link-alt"></i> Trang Chủ</a>
        </div>

        <!-- Điều hướng Tabs -->
        <div class="flex bg-white px-2 mt-2 gap-2 shadow-sm rounded-lg mx-2 p-1 sticky top-[60px] z-30 border border-gray-200">
            <button onclick="switchTab('uploadTab')" id="btn-uploadTab" class="flex-1 py-2 text-sm font-bold bg-pink-50 text-pink-600 rounded-md transition border border-pink-100"><i class="fas fa-plus-circle mr-1"></i> Đăng Giày</button>
            <button onclick="switchTab('inventoryTab')" id="btn-inventoryTab" class="flex-1 py-2 text-sm font-bold text-gray-500 hover:bg-gray-50 rounded-md transition"><i class="fas fa-box mr-1"></i> Kho Hàng</button>
            <button onclick="switchTab('orderTab')" id="btn-orderTab" class="flex-1 py-2 text-sm font-bold text-gray-500 hover:bg-gray-50 rounded-md transition"><i class="fas fa-list-alt mr-1"></i> Đơn Hàng</button>
        </div>

        <!-- TAB 1: ĐĂNG GIÀY MỚI -->
        <div id="uploadTab" class="p-3 tab-content block mt-2">
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-200">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <!-- Trái: Ảnh -->
                    <div>
                        <label class="block text-sm font-semibold mb-2 text-gray-700">1. Chọn Ảnh Sản Phẩm:</label>
                        <div class="relative w-full h-[300px] bg-gray-50 border-2 border-dashed border-gray-300 rounded-xl flex items-center justify-center overflow-hidden group hover:bg-gray-100 transition cursor-pointer">
                            <input type="file" id="imageInput" accept="image/*" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10" onchange="previewImage(this)">
                            <img id="imgPreview" src="" class="w-full h-full object-contain hidden">
                            <div id="imgPlaceholder" class="text-gray-400 text-sm flex flex-col items-center">
                                <i class="fas fa-cloud-upload-alt text-4xl mb-2 text-pink-300 group-hover:scale-110 transition-transform"></i>
                                <span class="font-bold">Bấm để tải ảnh lên</span>
                            </div>
                            <button id="btnRemoveImg" onclick="removePreview(event)" class="hidden absolute top-3 right-3 z-20 bg-red-500 text-white w-8 h-8 rounded-full flex items-center justify-center shadow-lg hover:bg-red-600 transition">
                                <i class="fas fa-times"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Phải: Thông tin -->
                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm font-semibold mb-2 text-gray-700">2. Chọn Size:</label>
                            <div class="grid grid-cols-5 gap-1.5" id="sizeOptions">
                                <!-- JS render -->
                            </div>
                        </div>

                        <div class="bg-amber-50 border border-amber-200 p-3 rounded-lg flex items-center gap-2 cursor-pointer hover:bg-amber-100 transition" onclick="toggleSpecialBrand()">
                            <input type="checkbox" id="isSpecialBrand" class="w-5 h-5 text-amber-600 rounded pointer-events-none">
                            <label class="font-bold text-sm text-amber-800 pointer-events-none">🌟 Hàng Vans/Converse</label>
                        </div>

                        <div>
                            <label class="block text-sm font-semibold mb-2 text-gray-700">3. Giá tiền (Tự động tính):</label>
                            <div class="relative">
                                <input type="number" id="shoePrice" class="w-full p-2.5 border border-gray-300 rounded-lg font-black bg-gray-100 text-lg text-pink-600 outline-none" readonly>
                                <span class="absolute right-4 top-2.5 font-bold text-gray-400">VNĐ</span>
                            </div>
                            <p class="text-[11px] text-gray-500 mt-1.5 font-semibold">≤35.5 (180k - CV 230k) | 36-36.5 (230k - CV 260k) | 37-39.5 (260k - CV 320k) | ≥40 (380k)</p>
                        </div>

                        <button id="btnUpload" onclick="uploadProduct()" class="w-full bg-black hover:bg-gray-800 text-white font-bold py-3.5 rounded-xl shadow-lg transition mt-4 flex items-center justify-center gap-2">
                            <i class="fas fa-cloud-upload-alt"></i> Đăng Lên Web
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- TAB 2: QUẢN LÝ KHO HÀNG -->
        <div id="inventoryTab" class="p-3 tab-content hidden mt-2">

            <div class="bg-white p-3 rounded-xl shadow-sm border border-gray-200 mb-4 flex flex-col md:flex-row gap-3 items-start md:items-center justify-between">
                <div class="flex items-center gap-2 w-full md:w-auto">
                    <span class="font-bold text-sm text-gray-700 shrink-0">Lọc Size:</span>
                    <select id="filterInventorySize" class="border border-gray-300 rounded-lg p-1.5 text-sm font-bold bg-gray-50 w-full md:w-auto outline-none focus:border-gray-400" onchange="loadInventory()">
                        <option value="Kid">Size Kid</option>
                    </select>
                </div>
                <div class="flex flex-wrap items-center gap-2 w-full md:w-auto justify-end">
                    <button onclick="selectAllBulk()" class="bg-gray-200 hover:bg-gray-300 text-gray-800 text-xs font-bold py-2 px-3 rounded-lg transition">Chọn tất cả</button>
                    <button id="btn-delete-bulk" onclick="deleteSelectedBulk()" class="bg-red-500 hover:bg-red-600 text-white text-xs font-bold py-2 px-3 rounded-lg shadow transition flex items-center justify-center gap-1">
                        <i class="fas fa-trash-alt"></i> Xóa <span id="deleteCount" class="mx-0.5">0</span>
                    </button>
                </div>
            </div>

            <h3 class="font-bold mb-3 text-gray-700 text-sm">Kho Hàng (<span id="countAvailable">0</span> đôi)</h3>
            <div id="adminProductList" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-3"></div>
        </div>

        <!-- TAB 3: ĐƠN HÀNG -->
        <div id="orderTab" class="p-3 tab-content hidden mt-2">
            <h3 class="font-bold mb-3 text-gray-700 text-sm">Lịch sử Yêu cầu tư vấn & Chốt đơn</h3>
            <div id="adminOrderList" class="space-y-3"></div>
        </div>
    </div>

    <!-- MODAL CHỈNH SỬA SẢN PHẨM -->
    <div id="editModal" class="fixed inset-0 bg-black/60 z-[100] hidden flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white rounded-2xl w-full max-w-sm p-5 shadow-2xl relative">
            <button onclick="closeEditModal()" class="absolute top-3 right-3 text-gray-400 hover:text-gray-800"><i class="fas fa-times text-xl"></i></button>
            <h3 class="font-bold text-lg mb-4 text-gray-800 border-b pb-2"><i class="fas fa-edit text-orange-500"></i> Sửa thông tin giày</h3>
            
            <input type="hidden" id="edit-id">
            <div class="space-y-3">
                <div>
                    <label class="block text-xs font-bold text-gray-600 mb-1">Size</label>
                    <input type="text" id="edit-size" class="w-full border border-gray-300 p-2.5 rounded-lg bg-gray-50 font-bold outline-none">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-600 mb-1">Giá bán (VNĐ)</label>
                    <input type="number" id="edit-price" class="w-full border border-gray-300 p-2.5 rounded-lg bg-gray-50 font-black text-pink-600 outline-none text-lg">
                </div>
            </div>
            
            <div class="flex gap-2 mt-6">
                <button onclick="closeEditModal()" class="flex-1 bg-gray-100 text-gray-700 font-bold py-3 rounded-xl hover:bg-gray-200 transition">Hủy bỏ</button>
                <button onclick="saveEdit()" class="flex-1 bg-black text-white font-bold py-3 rounded-xl shadow-lg hover:bg-gray-800 transition">Lưu lại</button>
            </div>
        </div>
    </div>

    <!-- MÀN HÌNH LOADING CHỜ XỬ LÝ -->
    <div id="loadingOverlay" class="fixed inset-0 bg-white/80 z-[300] hidden items-center justify-center backdrop-blur-sm">
        <div class="text-center bg-white p-8 rounded-2xl shadow-2xl border border-gray-100 w-full max-w-xs">
            <i class="fas fa-circle-notch fa-spin text-5xl text-pink-500 mb-4"></i>
            <p class="text-sm font-bold text-gray-800" id="loadingText">Đang xử lý...</p>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, serverTimestamp, doc, updateDoc, deleteDoc, writeBatch, getDocs, query, orderBy, limit } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        // FIREBASE CONFIG BÉ XÍU (Đồng bộ với index.html)
        const firebaseConfig = {
            apiKey: "AIzaSyCQczIrVe39Hs2d1bCt4OUgnOHK8NJFBq8",
            authDomain: "tiemgiaybexiu-c532a.firebaseapp.com",
            projectId: "tiemgiaybexiu-c532a",
            storageBucket: "tiemgiaybexiu-c532a.firebasestorage.app",
            messagingSenderId: "499321303408",
            appId: "1:499321303408:web:141656acab5eaf5ad95fb5"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        
        // IMAGEKIT API KEY
        const IK_PUBLIC_KEY = "public_TpeJE8MFvbvFRcBM4tQkurCc/0I=";
        const IK_PRIVATE_KEY = "private_ayTs6CE91ZpBtxpipgz2GmpKdjU="; 

        let allProductsRaw = [];

        async function generateIKAuth() {
            const token = Math.random().toString(36).substring(2, 15) + Math.random().toString(36).substring(2, 15);
            const expire = Math.floor(Date.now() / 1000) + 60 * 30;
            const str = token + expire;
            
            const enc = new TextEncoder();
            const key = await crypto.subtle.importKey(
                "raw", enc.encode(IK_PRIVATE_KEY),
                { name: "HMAC", hash: "SHA-1" },
                false, ["sign"]
            );
            const signatureBuffer = await crypto.subtle.sign("HMAC", key, enc.encode(str));
            const signatureArray = Array.from(new Uint8Array(signatureBuffer));
            return { 
                token: token, 
                expire: expire, 
                signature: signatureArray.map(b => b.toString(16).padStart(2, '0')).join('') 
            };
        }

        window.showAlert = function(msg) {
            document.getElementById('dialogMessage').innerText = msg;
            document.getElementById('dialogButtons').innerHTML = `<button onclick="closeDialog()" class="px-6 py-2 bg-pink-600 text-white font-bold rounded-xl hover:bg-pink-700 transition w-full">OK</button>`;
            document.getElementById('customDialog').classList.remove('hidden');
        }
        window.showConfirm = function(msg, onConfirm) {
            document.getElementById('dialogMessage').innerText = msg;
            window.currentConfirmCallback = onConfirm;
            document.getElementById('dialogButtons').innerHTML = `
                <button onclick="closeDialog()" class="flex-1 px-5 py-2 bg-gray-200 text-gray-800 font-bold rounded-xl hover:bg-gray-300 transition">Hủy</button>
                <button onclick="executeConfirm()" class="flex-1 px-5 py-2 bg-red-600 text-white font-bold rounded-xl hover:bg-red-700 transition">Đồng ý</button>
            `;
            document.getElementById('customDialog').classList.remove('hidden');
        }
        window.closeDialog = function() { document.getElementById('customDialog').classList.add('hidden'); }
        window.executeConfirm = function() { closeDialog(); if(window.currentConfirmCallback) window.currentConfirmCallback(); }

        window.showLoading = function(text) {
            document.getElementById('loadingText').innerText = text;
            document.getElementById('loadingOverlay').classList.remove('hidden');
            document.getElementById('loadingOverlay').classList.add('flex');
        }
        window.hideLoading = function() {
            document.getElementById('loadingOverlay').classList.add('hidden');
            document.getElementById('loadingOverlay').classList.remove('flex');
        }

        window.checkLogin = function() {
            if(document.getElementById('passCode').value === '3119') {
                document.getElementById('loginSection').classList.add('hidden');
                document.getElementById('adminPanel').classList.remove('hidden');
                initAdmin();
            } else { window.showAlert('Sai mật khẩu!'); }
        }

        const sizes = ['Kid','33','33.5','34','34.5','35','35.5','36','36.5','37','37.5','38','38.5','39','39.5','40', '41', '42', '43', '44', '45'];

        function initAdmin() {
            const sizeContainer = document.getElementById('sizeOptions');
            const filterSizeSelect = document.getElementById('filterInventorySize');
            sizes.forEach(s => {
                sizeContainer.innerHTML += `
                    <div class="text-center">
                        <input type="radio" name="size" id="size_${s}" value="${s}" class="peer hidden" onchange="autoCalcPrice()">
                        <label for="size_${s}" class="block py-1.5 border border-gray-300 rounded-lg cursor-pointer peer-checked:bg-pink-500 peer-checked:text-white peer-checked:border-pink-500 text-[11px] font-bold transition hover:bg-gray-100">${s}</label>
                    </div>
                `;
                if(s !== 'Kid') filterSizeSelect.innerHTML += `<option value="${s}">Size ${s}</option>`;
            });
            fetchInventoryData();
            loadOrders();
        }

        window.toggleSpecialBrand = function() {
            const cb = document.getElementById('isSpecialBrand');
            cb.checked = !cb.checked;
            window.autoCalcPrice();
        }

        window.autoCalcPrice = function() {
            const isSpecial = document.getElementById('isSpecialBrand').checked;
            const sizeInput = document.querySelector('input[name="size"]:checked');
            const priceInput = document.getElementById('shoePrice');
            if (sizeInput) {
                let sNum = parseFloat(sizeInput.value);
                if (sizeInput.value === 'Kid' || sNum <= 35.5) priceInput.value = isSpecial ? 230000 : 180000;
                else if (sNum === 36 || sNum === 36.5) priceInput.value = isSpecial ? 260000 : 230000;
                else if (sNum >= 37 && sNum <= 39.5) priceInput.value = isSpecial ? 320000 : 260000;
                else if (sNum >= 40) priceInput.value = 380000;
            } else priceInput.value = 0;
        }

        window.previewImage = function(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = e => {
                    document.getElementById('imgPreview').src = e.target.result;
                    document.getElementById('imgPreview').classList.remove('hidden');
                    document.getElementById('imgPlaceholder').classList.add('hidden');
                    document.getElementById('btnRemoveImg').classList.remove('hidden');
                }
                reader.readAsDataURL(input.files[0]);
            }
        }

        window.removePreview = function(e) {
            e.preventDefault();
            document.getElementById('imageInput').value = '';
            document.getElementById('imgPreview').src = '';
            document.getElementById('imgPreview').classList.add('hidden');
            document.getElementById('imgPlaceholder').classList.remove('hidden');
            document.getElementById('btnRemoveImg').classList.add('hidden');
        }

        window.uploadProduct = async function() {
            const sizeInput = document.querySelector('input[name="size"]:checked');
            const price = parseInt(document.getElementById('shoePrice').value);
            const imgFile = document.getElementById('imageInput').files[0];
            const btn = document.getElementById('btnUpload');

            if(!sizeInput || !price || !imgFile) { window.showAlert('Vui lòng chọn Size và Tải ảnh lên!'); return; }

            btn.disabled = true; 
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Đang nén & Tải lên...';

            try {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image();
                    img.onload = function() {
                        const MAX_DIMENSION = 1000;
                        let width = img.width;
                        let height = img.height;

                        if (width > height) {
                            if (width > MAX_DIMENSION) {
                                height *= MAX_DIMENSION / width;
                                width = MAX_DIMENSION;
                            }
                        } else {
                            if (height > MAX_DIMENSION) {
                                width *= MAX_DIMENSION / height;
                                height = MAX_DIMENSION;
                            }
                        }

                        const canvas = document.createElement('canvas');
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);

                        canvas.toBlob(async (blob) => {
                            try {
                                const auth = await generateIKAuth();
                                const formData = new FormData();
                                const fileName = "bx_" + Date.now() + Math.random().toString(36).substring(7) + ".jpg";

                                formData.append("file", blob);
                                formData.append("fileName", fileName);
                                formData.append("folder", "/bexiu_shoes");
                                formData.append("publicKey", IK_PUBLIC_KEY);
                                formData.append("signature", auth.signature);
                                formData.append("expire", auth.expire);
                                formData.append("token", auth.token);

                                const res = await fetch("https://upload.imagekit.io/api/v1/files/upload", {
                                    method: "POST",
                                    body: formData
                                });

                                if(!res.ok) throw new Error("ImageKit từ chối tải ảnh");
                                const ikData = await res.json();

                                await addDoc(collection(db, "products"), {
                                    size: sizeInput.value, 
                                    price: price,
                                    imageUrl: ikData.url, 
                                    ikFileId: ikData.fileId, 
                                    status: 'available', 
                                    createdAt: serverTimestamp()
                                });

                                window.showAlert('✅ Đăng giày lên kệ thành công!');
                                window.removePreview(new Event('click'));
                                sizeInput.checked = false;
                                document.getElementById('shoePrice').value = '';
                                
                            } catch (err) {
                                window.showAlert('Lỗi tải lên ImageKit: ' + err.message);
                            } finally {
                                btn.disabled = false; btn.innerHTML = '<i class="fas fa-cloud-upload-alt"></i> Đăng Lên Web';
                            }
                        }, 'image/jpeg', 0.8);
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(imgFile);
            } catch (err) {
                window.showAlert('Lỗi hệ thống: ' + err.message);
                btn.disabled = false; btn.innerHTML = 'Đăng Lỗi - Thử Lại';
            }
        }

        window.switchTab = function(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.querySelectorAll('[id^="btn-"]').forEach(btn => btn.className = "flex-1 py-2 text-sm font-bold text-gray-500 hover:bg-gray-50 rounded-md transition border border-transparent");
            document.getElementById(tabId).classList.remove('hidden');
            document.getElementById('btn-' + tabId).className = "flex-1 py-2 text-sm font-bold bg-pink-50 text-pink-600 rounded-md transition border border-pink-100 shadow-sm";
        }

        const parseTimestamp = (val) => {
            if (!val) return 0;
            if (typeof val.toMillis === 'function') return val.toMillis();
            if (val.seconds) return val.seconds * 1000;
            if (val instanceof Date) return val.getTime();
            if (typeof val === 'number') return val;
            return new Date(val).getTime() || 0;
        };

        function fetchInventoryData() {
            onSnapshot(collection(db, "products"), (snapshot) => {
                allProductsRaw = [];
                snapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    if(data.status === 'available' || !data.status || !data.isSold) {
                        const img = data.imageUrl || (data.images && data.images.length > 0 ? data.images[0] : '');
                        allProductsRaw.push({ id: docSnap.id, ...data, img: img });
                    }
                });
                
                allProductsRaw.sort((a, b) => parseTimestamp(b.createdAt) - parseTimestamp(a.createdAt));
                window.loadInventory();
            }, (error) => {
                window.showAlert("Lỗi tải dữ liệu kho hàng: " + error.message);
            });
        }

        window.loadInventory = function() {
            const container = document.getElementById('adminProductList');
            const filterSize = document.getElementById('filterInventorySize').value;
            container.innerHTML = '';
            
            let displayProducts = allProductsRaw.filter(p => String(p.size).trim() === filterSize);
            
            document.getElementById('countAvailable').innerText = displayProducts.length;

            displayProducts.forEach((p) => {
                container.innerHTML += `
                    <div class="bg-white border border-gray-200 rounded-xl p-2 text-center shadow-sm flex flex-col justify-between relative group">
                        <div class="absolute top-3 left-3 z-10">
                            <input type="checkbox" class="bulk-cb bg-white border-2 shadow" 
                                value="${p.id}" onchange="updateSelectedCount()">
                        </div>
                        <div>
                            <div class="w-full h-32 bg-gray-50 rounded-lg overflow-hidden mb-2 relative cursor-pointer" onclick="openZoom('${p.img}')">
                                <img src="${p.img}" class="w-full h-full object-cover">
                            </div>
                            <div class="text-[11px] font-bold text-pink-600 bg-pink-50 py-1 rounded mt-1 border border-pink-100">Size ${p.size} • ${Number(p.price).toLocaleString('vi-VN')}đ</div>
                        </div>
                        <div class="flex items-center gap-1 mt-3">
                            <button onclick="openEditModal('${p.id}', '${p.size}', ${p.price})" class="flex-1 text-xs bg-blue-50 text-blue-600 hover:bg-blue-100 py-2 rounded font-bold transition"><i class="fas fa-pen"></i> Sửa</button>
                            <button onclick="deleteProduct('${p.id}')" class="flex-1 text-xs bg-red-50 text-red-500 hover:bg-red-100 py-2 rounded font-bold transition"><i class="fas fa-trash"></i> Xóa</button>
                        </div>
                    </div>
                `;
            });
            window.updateSelectedCount(); 
        }

        window.updateSelectedCount = function() {
            const count = document.querySelectorAll('.bulk-cb:checked').length;
            document.getElementById('deleteCount').innerText = count;
        }

        window.selectAllBulk = function() {
            const checkboxes = document.querySelectorAll('.bulk-cb');
            const allChecked = Array.from(checkboxes).every(cb => cb.checked);
            checkboxes.forEach(cb => cb.checked = !allChecked);
            window.updateSelectedCount();
        }

        window.deleteIKFile = async function(fileId) {
            if(!fileId) return;
            try {
                await fetch(`https://api.imagekit.io/v1/files/${fileId}`, {
                    method: "DELETE", headers: { "Authorization": "Basic " + btoa(IK_PRIVATE_KEY + ":") }
                });
            } catch(e) { console.log("Bỏ qua lỗi xóa IK"); }
        }

        window.deleteProduct = function(id) {
            window.showConfirm('Chắc chắn xóa đôi này khỏi kho?', async () => {
                const p = allProductsRaw.find(x => x.id === id);
                if(p && p.ikFileId) window.deleteIKFile(p.ikFileId).catch(()=>{});
                await deleteDoc(doc(db, "products", id));
            });
        }

        window.deleteSelectedBulk = async function() {
            const checkedBoxes = document.querySelectorAll('.bulk-cb:checked');
            if (checkedBoxes.length === 0) return window.showAlert('Chưa chọn ảnh nào!');

            window.showConfirm(`XÓA VĨNH VIỄN ${checkedBoxes.length} đôi giày (bao gồm cả ảnh)?`, async () => {
                window.showLoading(`Đang xóa ${checkedBoxes.length} sản phẩm...`);

                try {
                    let count = 0;
                    for (let i = 0; i < checkedBoxes.length; i++) {
                        const id = checkedBoxes[i].value;
                        const p = allProductsRaw.find(x => x.id === id);
                        
                        if(p && p.ikFileId) {
                            window.deleteIKFile(p.ikFileId).catch(()=>{});
                        }
                        
                        await deleteDoc(doc(db, "products", id));
                        count++;
                        
                        document.getElementById('loadingText').innerText = `Đang xóa: ${count} / ${checkedBoxes.length} đôi...`;
                    }
                    
                    window.hideLoading();
                    window.showAlert(`✅ Đã dọn dẹp ${checkedBoxes.length} sản phẩm!`);
                    
                    document.querySelectorAll('.bulk-cb').forEach(cb => cb.checked = false);
                    window.updateSelectedCount();
                } catch (error) {
                    window.hideLoading();
                    window.showAlert("Lỗi xóa: " + error.message);
                } 
            });
        }

        window.openEditModal = function(id, size, price) {
            document.getElementById('edit-id').value = id; 
            document.getElementById('edit-size').value = size; 
            document.getElementById('edit-price').value = price;
            document.getElementById('editModal').classList.remove('hidden');
        }
        window.closeEditModal = function() { document.getElementById('editModal').classList.add('hidden'); }

        window.saveEdit = async function() {
            const id = document.getElementById('edit-id').value;
            const size = document.getElementById('edit-size').value.trim();
            const price = Number(document.getElementById('edit-price').value);
            if(!size || !price) return window.showAlert('Vui lòng nhập đủ!');
            try {
                await updateDoc(doc(db, "products", id), { size: size, price: price });
                window.closeEditModal(); window.showAlert('✅ Lưu thành công!');
            } catch (error) { window.showAlert('Lỗi: ' + error.message); }
        }

        window.loadOrders = function() {
            onSnapshot(query(collection(db, "orders"), orderBy("timestamp", "desc"), limit(30)), (snapshot) => {
                const container = document.getElementById('adminOrderList'); container.innerHTML = '';
                snapshot.forEach(docSnap => {
                    const data = docSnap.data();
                    const date = data.timestamp ? (data.timestamp.toDate ? data.timestamp.toDate().toLocaleString('vi-VN') : 'Mới') : 'Mới';
                    container.innerHTML += `
                        <div class="bg-white p-3.5 rounded-xl border border-gray-200 shadow-sm flex flex-col md:flex-row justify-between gap-3">
                            <div class="flex items-center gap-4">
                                <a href="${data.imageUrl}" target="_blank">
                                    <img src="${data.imageUrl}" class="w-16 h-16 object-cover rounded-lg border border-gray-100">
                                </a>
                                <div class="flex flex-col">
                                    <div class="flex items-center gap-2">
                                        <span class="bg-gray-100 text-gray-600 text-[10px] px-2 py-0.5 rounded font-bold">${date}</span>
                                    </div>
                                    <div class="font-bold text-gray-800 mt-1">${data.customerName || 'Khách'} - <a href="https://zalo.me/${data.customerPhone}" target="_blank" class="text-blue-600 underline">${data.customerPhone}</a></div>
                                    <div class="text-xs font-black text-pink-600 mt-1">Size ${data.size} - ${(data.price || 0).toLocaleString('vi-VN')}đ</div>
                                </div>
                            </div>
                            <div class="flex items-center">
                                <button onclick="deleteDoc(doc(db, 'orders', '${docSnap.id}'))" class="bg-red-50 text-red-500 px-3 py-2 rounded-lg text-xs font-bold hover:bg-red-100 w-full md:w-auto transition"><i class="fas fa-trash"></i> Xóa đơn</button>
                            </div>
                        </div>
                    `;
                });
            });
        }
        window.openZoom = function(url) { window.open(url, '_blank'); }
    </script>
</body>
</html>
