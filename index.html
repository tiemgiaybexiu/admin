<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Admin - Tiệm giày Bé Xíu</title>
    <!-- Font chữ Inter thống nhất -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: { fontFamily: { sans: ['Inter', 'sans-serif'] } }
            }
        }
    </script>

    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .bulk-cb { width: 22px; height: 22px; cursor: pointer; accent-color: #ec4899; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 pb-20">

    <!-- Custom Confirm / Alert Dialog -->
    <div id="customDialog" class="fixed inset-0 bg-black/60 z-[200] hidden flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white rounded-2xl w-full max-w-sm p-6 shadow-2xl text-center">
            <h3 id="dialogMessage" class="text-gray-800 font-bold text-sm mb-6">Message</h3>
            <div id="dialogButtons" class="flex gap-3 justify-center">
                <!-- Buttons injected by JS -->
            </div>
        </div>
    </div>

    <!-- KHUNG ĐĂNG NHẬP -->
    <div id="loginSection" class="min-h-screen flex items-center justify-center px-4 bg-gray-100">
        <div class="bg-white p-8 rounded-2xl shadow-xl max-w-sm w-full text-center">
            <div class="w-20 h-20 bg-pink-50 rounded-full mx-auto flex items-center justify-center mb-4 border-4 border-pink-100">
                <i class="fas fa-lock text-3xl text-pink-400"></i>
            </div>
            <h2 class="text-2xl font-bold mb-6 text-gray-700">Quản Trị Viên</h2>
            <input type="password" id="passCode" placeholder="Nhập mã pin..." class="w-full text-center p-3 border-2 border-gray-200 rounded-xl mb-4 text-xl tracking-widest focus:border-pink-500 focus:outline-none">
            <button onclick="checkLogin()" class="w-full bg-pink-600 hover:bg-pink-700 text-white font-bold py-3 rounded-xl transition shadow-md">Đăng Nhập</button>
        </div>
    </div>

    <!-- GIAO DIỆN ADMIN CHÍNH -->
    <div id="adminPanel" class="hidden max-w-5xl mx-auto">
        
        <!-- Header -->
        <div class="bg-white shadow-sm p-4 sticky top-0 z-40 border-b flex justify-between items-center">
            <div class="font-black text-lg text-pink-600"><i class="fas fa-shoe-prints mr-2"></i>Bé Xíu Admin</div>
            <a href="index.html" target="_blank" class="text-xs bg-gray-100 font-bold px-3 py-2 rounded-lg hover:bg-gray-200"><i class="fas fa-external-link-alt"></i> Xem Trang Chủ</a>
        </div>

        <!-- Điều hướng Tabs -->
        <div class="flex bg-white px-2 mt-2 gap-2 shadow-sm rounded-lg mx-2 p-1 sticky top-[60px] z-30 border border-gray-200">
            <button onclick="switchTab('uploadTab')" id="btn-uploadTab" class="flex-1 py-2 text-sm font-bold bg-pink-50 text-pink-600 rounded-md transition"><i class="fas fa-plus-circle mr-1"></i> Đăng Giày</button>
            <button onclick="switchTab('inventoryTab')" id="btn-inventoryTab" class="flex-1 py-2 text-sm font-bold text-gray-500 hover:bg-gray-50 rounded-md transition"><i class="fas fa-box mr-1"></i> Kho Hàng</button>
            <button onclick="switchTab('orderTab')" id="btn-orderTab" class="flex-1 py-2 text-sm font-bold text-gray-500 hover:bg-gray-50 rounded-md transition"><i class="fas fa-list-alt mr-1"></i> Đơn Hàng</button>
        </div>

        <!-- TAB 1: ĐĂNG GIÀY MỚI -->
        <div id="uploadTab" class="p-3 tab-content block mt-2">
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-200">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <!-- Trái: Ảnh (Dạng Khung Đẹp) -->
                    <div>
                        <label class="block text-sm font-semibold mb-2 text-gray-700">1. Chọn 1 Ảnh Vuông (Rõ nét):</label>
                        <div class="relative aspect-square bg-gray-50 border-2 border-dashed border-gray-300 rounded-xl flex items-center justify-center overflow-hidden group hover:bg-gray-100 transition cursor-pointer">
                            <input type="file" id="imageInput" accept="image/*" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10" onchange="previewImage(this)">
                            
                            <img id="imgPreview" src="" class="w-full h-full object-cover hidden">
                            
                            <div id="imgPlaceholder" class="text-gray-400 text-sm flex flex-col items-center">
                                <i class="fas fa-cloud-upload-alt text-4xl mb-2 text-pink-300 group-hover:scale-110 transition-transform"></i>
                                <span class="font-bold">Bấm để tải ảnh lên</span>
                            </div>

                            <button id="btnRemoveImg" onclick="removePreview(event)" class="hidden absolute top-3 right-3 z-20 bg-red-500 text-white w-8 h-8 rounded-full flex items-center justify-center shadow-lg hover:bg-red-600 transition">
                                <i class="fas fa-times"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Phải: Thông tin -->
                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm font-semibold mb-2 text-gray-700">2. Mã giày (Tự động):</label>
                            <div class="flex gap-2">
                                <input type="text" id="shoeCode" readonly placeholder="Mã ngẫu nhiên..." class="w-full p-2.5 border border-gray-300 rounded-lg bg-gray-100 font-black text-gray-600 outline-none tracking-wider">
                                <button onclick="generateRandomCode()" class="bg-blue-50 text-blue-600 border border-blue-200 hover:bg-blue-100 px-4 rounded-lg font-bold transition shadow-sm" title="Đổi mã khác">
                                    <i class="fas fa-random"></i>
                                </button>
                            </div>
                        </div>

                        <div>
                            <label class="block text-sm font-semibold mb-2 text-gray-700">3. Chọn Size:</label>
                            <div class="grid grid-cols-5 gap-1.5" id="sizeOptions">
                                <!-- JS render -->
                            </div>
                        </div>

                        <div class="bg-amber-50 border border-amber-200 p-3 rounded-lg flex items-center gap-2 cursor-pointer hover:bg-amber-100 transition" onclick="toggleSpecialBrand()">
                            <input type="checkbox" id="isSpecialBrand" class="w-5 h-5 text-amber-600 rounded pointer-events-none">
                            <label class="font-bold text-sm text-amber-800 pointer-events-none">🌟 Hàng Vans/Converse</label>
                        </div>

                        <div>
                            <label class="block text-sm font-semibold mb-2 text-gray-700">4. Giá tiền (Tự động):</label>
                            <div class="relative">
                                <input type="number" id="shoePrice" class="w-full p-2.5 border border-gray-300 rounded-lg font-black text-brand-rose bg-gray-100 text-lg text-pink-600 outline-none" readonly>
                                <span class="absolute right-4 top-2.5 font-bold text-gray-400">VNĐ</span>
                            </div>
                            <p class="text-[11px] text-gray-500 mt-1.5 font-semibold">≤35.5 (180k) | 36 (230k) | 37-39.5 (260k, Vans/Converse 320k) | ≥40 (380k)</p>
                        </div>

                        <div>
                            <label class="block text-sm font-semibold mb-2 text-gray-700">4. Giá tiền (Tự động):</label>
                            <div class="relative">
                                <input type="number" id="shoePrice" class="w-full p-2.5 border border-gray-300 rounded-lg font-black text-brand-rose bg-gray-100 text-lg text-pink-600 outline-none" readonly>
                                <span class="absolute right-4 top-2.5 font-bold text-gray-400">VNĐ</span>
                            </div>
                            <p class="text-[11px] text-gray-500 mt-1.5 font-semibold">Tự động: ≤35.5 (180k) | 36-36.5 (230k) | ≥37 (260k)</p>
                        </div>

                        <button id="btnUpload" onclick="uploadProduct()" class="w-full bg-black hover:bg-gray-800 text-white font-bold py-3.5 rounded-xl shadow-lg transition mt-4 flex items-center justify-center gap-2">
                            <i class="fas fa-cloud-upload-alt"></i> Đăng Lên Web
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- TAB 2: QUẢN LÝ KHO HÀNG -->
        <div id="inventoryTab" class="p-3 tab-content hidden mt-2">
            
            <!-- TOOLBAR LỌC & TẢI HÀNG LOẠT -->
            <div class="bg-white p-3 rounded-xl shadow-sm border border-gray-200 mb-4 flex flex-col md:flex-row gap-3 items-start md:items-center justify-between">
                
                <div class="flex items-center gap-2 w-full md:w-auto">
                    <span class="font-bold text-sm text-gray-700 shrink-0">Lọc Size:</span>
                    <select id="filterInventorySize" class="border border-gray-300 rounded-lg p-1.5 text-sm font-bold bg-gray-50 w-full md:w-auto outline-none focus:border-gray-400" onchange="loadInventory()">
                        <option value="ALL">Tất cả</option>
                        <option value="Kid">Size Kid</option>
                        <!-- Các option khác sẽ được render bằng JS -->
                    </select>
                </div>

                <div class="flex flex-wrap items-center gap-2 w-full md:w-auto justify-end">
                    <button onclick="selectAllBulk()" class="bg-gray-200 hover:bg-gray-300 text-gray-800 text-xs font-bold py-2 px-3 rounded-lg transition">
                        Chọn tất cả
                    </button>
                    <button id="btn-download-bulk" onclick="downloadSelectedBulk()" class="bg-green-600 hover:bg-green-700 text-white text-xs font-bold py-2 px-3 rounded-lg shadow transition flex items-center justify-center gap-1">
                        <i class="fas fa-download"></i> Tải <span id="selectedCount" class="mx-0.5">0</span>
                    </button>
                    <button id="btn-delete-bulk" onclick="deleteSelectedBulk()" class="bg-red-500 hover:bg-red-600 text-white text-xs font-bold py-2 px-3 rounded-lg shadow transition flex items-center justify-center gap-1">
                        <i class="fas fa-trash-alt"></i> Xóa <span id="deleteCount" class="mx-0.5">0</span>
                    </button>
                </div>
            </div>

            <h3 class="font-bold mb-3 text-gray-700 text-sm">Kho Hàng (<span id="countAvailable">0</span> đôi)</h3>
            <div id="adminProductList" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-2 md:gap-3">
                <!-- Data load ở đây -->
            </div>
        </div>

        <!-- TAB 3: ĐƠN HÀNG -->
        <div id="orderTab" class="p-3 tab-content hidden mt-2">
            <button onclick="testTelegramBot()" class="w-full bg-blue-50 text-blue-700 py-3 rounded-xl font-bold mb-4 border border-blue-200 active:bg-blue-100 transition shadow-sm text-sm">
                <i class="fab fa-telegram-plane mr-1 text-lg"></i> Test tin nhắn Bot Telegram
            </button>
            <h3 class="font-bold mb-3 text-gray-700 text-sm">Lịch sử Yêu cầu tư vấn & Chốt đơn</h3>
            <div id="adminOrderList" class="space-y-3">
                <!-- Data load ở đây -->
            </div>
        </div>
    </div>

    <!-- MODAL CHỈNH SỬA SẢN PHẨM -->
    <div id="editModal" class="fixed inset-0 bg-black/60 z-[100] hidden flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white rounded-2xl w-full max-w-sm p-5 shadow-2xl relative">
            <button onclick="closeEditModal()" class="absolute top-3 right-3 text-gray-400 hover:text-gray-800">
                <i class="fas fa-times text-xl"></i>
            </button>
            <h3 class="font-bold text-lg mb-4 text-gray-800 border-b pb-2"><i class="fas fa-edit text-orange-500"></i> Sửa thông tin giày</h3>
            
            <input type="hidden" id="edit-id">
            <div class="space-y-3">
                <div>
                    <label class="block text-xs font-bold text-gray-600 mb-1">Mã giày</label>
                    <input type="text" id="edit-code" class="w-full border border-gray-300 p-2.5 rounded-lg bg-gray-50 font-bold uppercase focus:border-blue-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-600 mb-1">Size</label>
                    <input type="text" id="edit-size" class="w-full border border-gray-300 p-2.5 rounded-lg bg-gray-50 font-bold focus:border-blue-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-600 mb-1">Giá bán (VNĐ)</label>
                    <input type="number" id="edit-price" class="w-full border border-gray-300 p-2.5 rounded-lg bg-gray-50 font-black text-pink-600 focus:border-blue-500 outline-none text-lg">
                </div>
            </div>
            
            <div class="flex gap-2 mt-6">
                <button onclick="closeEditModal()" class="flex-1 bg-gray-100 text-gray-700 font-bold py-3 rounded-xl hover:bg-gray-200 transition">Hủy bỏ</button>
                <button onclick="saveEdit()" class="flex-1 bg-black text-white font-bold py-3 rounded-xl shadow-lg hover:bg-gray-800 transition flex items-center justify-center gap-2">
                    <i class="fas fa-save"></i> Lưu lại
                </button>
            </div>
        </div>
    </div>

    <!-- CANVAS DÙNG ĐỂ RENDER ẢNH WATERMARK (ẨN) -->
    <canvas id="watermarkCanvas" class="hidden"></canvas>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, serverTimestamp, doc, updateDoc, deleteDoc, writeBatch, getDocs, query, where, limit, orderBy } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        // FIREBASE CONFIG
        const fbP1 = "AIzaSyCVAm"; const fbP2 = "JO1KViXVg3"; const fbP3 = "kizelTp6CZ"; const fbP4 = "AFmJLkKiM";
        const firebaseConfig = {
            apiKey: fbP1 + fbP2 + fbP3 + fbP4,
            authDomain: "donggia-8ef8e.firebaseapp.com",
            projectId: "donggia-8ef8e",
            storageBucket: "donggia-8ef8e.firebasestorage.app"
        };
        
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        
        let allProductsRaw = [];

        // CUSTOM DIALOGS
        window.showAlert = function(msg) {
            document.getElementById('dialogMessage').innerText = msg;
            document.getElementById('dialogButtons').innerHTML = `<button onclick="closeDialog()" class="px-6 py-2 bg-pink-600 text-white font-bold rounded-xl hover:bg-pink-700 transition w-full">OK</button>`;
            document.getElementById('customDialog').classList.remove('hidden');
        }
        window.showConfirm = function(msg, onConfirm) {
            document.getElementById('dialogMessage').innerText = msg;
            window.currentConfirmCallback = onConfirm;
            document.getElementById('dialogButtons').innerHTML = `
                <button onclick="closeDialog()" class="flex-1 px-5 py-2 bg-gray-200 text-gray-800 font-bold rounded-xl hover:bg-gray-300 transition">Hủy</button>
                <button onclick="executeConfirm()" class="flex-1 px-5 py-2 bg-red-600 text-white font-bold rounded-xl hover:bg-red-700 transition">Đồng ý</button>
            `;
            document.getElementById('customDialog').classList.remove('hidden');
        }
        window.closeDialog = function() { document.getElementById('customDialog').classList.add('hidden'); }
        window.executeConfirm = function() { closeDialog(); if(window.currentConfirmCallback) window.currentConfirmCallback(); }

        // 1. ĐĂNG NHẬP
        window.checkLogin = function() {
            if(document.getElementById('passCode').value === '3119') {
                document.getElementById('loginSection').classList.add('hidden');
                document.getElementById('adminPanel').classList.remove('hidden');
                initAdmin();
            } else { window.showAlert('Sai mật khẩu!'); }
        }

        const sizes = ['Kid','33','33.5','34','34.5','35','35.5','36','36.5','37','37.5','38','38.5','39','39.5','40', '41', '42', '43', '44', '45'];

        function initAdmin() {
            const sizeContainer = document.getElementById('sizeOptions');
            const filterSizeSelect = document.getElementById('filterInventorySize');
            
            sizes.forEach(s => {
                sizeContainer.innerHTML += `
                    <div class="text-center">
                        <input type="radio" name="size" id="size_${s}" value="${s}" class="peer hidden" onchange="autoCalcPrice()">
                        <label for="size_${s}" class="block py-1.5 border border-gray-300 rounded-lg cursor-pointer peer-checked:bg-pink-500 peer-checked:text-white peer-checked:border-pink-500 text-[11px] font-bold transition hover:bg-gray-100">${s}</label>
                    </div>
                `;
                if(s !== 'Kid') filterSizeSelect.innerHTML += `<option value="${s}">Size ${s}</option>`;
            });
            
            generateRandomCode();
            fetchInventoryData();
            loadOrders();
        }

        // TẠO MÃ TỰ ĐỘNG
        window.generateRandomCode = function() {
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
            const nums = '0123456789';
            let res = chars.charAt(Math.floor(Math.random() * chars.length));
            for(let i=0; i<3; i++) res += nums.charAt(Math.floor(Math.random() * nums.length));
            document.getElementById('shoeCode').value = res;
        }

        // 2. TÍNH GIÁ (Cho Upload)
        window.toggleSpecialBrand = function() {
            const cb = document.getElementById('isSpecialBrand');
            cb.checked = !cb.checked;
            window.autoCalcPrice();
        }

        window.autoCalcPrice = function() {
            const isSpecial = document.getElementById('isSpecialBrand').checked;
            const sizeInput = document.querySelector('input[name="size"]:checked');
            const priceInput = document.getElementById('shoePrice');
            
            if (sizeInput) {
                let sVal = sizeInput.value;
                let sNum = parseFloat(sVal);
                
                if (sVal === 'Kid' || sNum <= 35.5) {
                    priceInput.value = 180000;
                } else if (sNum === 36 || sNum === 36.5) {
                    priceInput.value = 230000;
                } else if (sNum >= 37 && sNum <= 39.5) {
                    if (isSpecial) priceInput.value = 320000;
                    else priceInput.value = 260000;
                } else if (sNum >= 40) {
                    priceInput.value = 380000;
                } else {
                    priceInput.value = 0;
                }
            } else {
                priceInput.value = 0;
            }
        }

        // 3. UPLOAD ẢNH & DATA
        window.previewImage = function(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('imgPreview').src = e.target.result;
                    document.getElementById('imgPreview').classList.remove('hidden');
                    document.getElementById('imgPlaceholder').classList.add('hidden');
                    document.getElementById('btnRemoveImg').classList.remove('hidden');
                }
                reader.readAsDataURL(input.files[0]);
            }
        }

        window.removePreview = function(e) {
            e.preventDefault();
            document.getElementById('imageInput').value = '';
            document.getElementById('imgPreview').src = '';
            document.getElementById('imgPreview').classList.add('hidden');
            document.getElementById('imgPlaceholder').classList.remove('hidden');
            document.getElementById('btnRemoveImg').classList.add('hidden');
        }

        window.uploadProduct = async function() {
            const code = document.getElementById('shoeCode').value.toUpperCase().trim();
            const sizeInput = document.querySelector('input[name="size"]:checked');
            const price = parseInt(document.getElementById('shoePrice').value);
            const imgFile = document.getElementById('imageInput').files[0];
            const btn = document.getElementById('btnUpload');

            if(!code || !sizeInput || !price || !imgFile) { window.showAlert('Điền đủ Mã, Size, Giá và Ảnh nhé!'); return; }

            btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Đang tải lên...';

            try {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image();
                    img.onload = async function() {
                        // Tự động Nén và Crop hình vuông bằng Canvas
                        const canvas = document.createElement('canvas');
                        const TARGET_SIZE = 800; // Đưa về chuẩn 800x800px cho nhẹ và nét
                        canvas.width = TARGET_SIZE;
                        canvas.height = TARGET_SIZE;
                        const ctx = canvas.getContext('2d');

                        // Tính toán tọa độ để Crop chính giữa ảnh nếu ảnh là hình chữ nhật
                        const minDim = Math.min(img.width, img.height);
                        const startX = (img.width - minDim) / 2;
                        const startY = (img.height - minDim) / 2;

                        // Vẽ ảnh đã crop lên Canvas
                        ctx.drawImage(img, startX, startY, minDim, minDim, 0, 0, TARGET_SIZE, TARGET_SIZE);

                        // Xuất ảnh ra chuỗi Base64 (Chất lượng 80% để nhẹ hơn 1MB rất nhiều)
                        const base64Img = canvas.toDataURL('image/jpeg', 0.8);

                        try {
                            await addDoc(collection(db, "products"), {
                                code: code, size: sizeInput.value, price: price,
                                imageUrl: base64Img, images: [base64Img], status: 'available',
                                createdAt: serverTimestamp()
                            });
                            window.showAlert('✅ Đăng sản phẩm thành công!');
                            
                            window.generateRandomCode();
                            window.removePreview(new Event('click'));
                            if(sizeInput) sizeInput.checked = false;
                            document.getElementById('shoePrice').value = '';
                            document.getElementById('isSpecialBrand').checked = false;
                            
                            btn.disabled = false; btn.innerHTML = '<i class="fas fa-cloud-upload-alt"></i> Đăng Lên Web';
                        } catch (err) {
                            window.showAlert('Lỗi tải lên: ' + err.message);
                            btn.disabled = false; btn.innerHTML = 'Đăng Lỗi - Thử Lại';
                        }
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(imgFile);
            } catch (err) {
                window.showAlert('Lỗi xử lý file: ' + err.message);
                btn.disabled = false; btn.innerHTML = 'Đăng Lỗi - Thử Lại';
            }
        }

        window.switchTab = function(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.querySelectorAll('[id^="btn-"]').forEach(btn => btn.className = "flex-1 py-2 text-sm font-bold text-gray-500 hover:bg-gray-50 rounded-md transition");
            document.getElementById(tabId).classList.remove('hidden');
            document.getElementById('btn-' + tabId).className = "flex-1 py-2 text-sm font-bold bg-pink-50 text-pink-600 rounded-md transition border border-pink-100 shadow-sm";
        }

        // 4. KHO HÀNG & LỌC
        function fetchInventoryData() {
            onSnapshot(collection(db, "products"), (snapshot) => {
                allProductsRaw = [];
                snapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    if(data.status === 'available' || !data.isSold) {
                        const img = (data.images && data.images.length > 0) ? data.images[0] : data.imageUrl;
                        allProductsRaw.push({ id: docSnap.id, ...data, img: img });
                    }
                });
                
                allProductsRaw.sort((a, b) => {
                    const timeA = a.createdAt ? (a.createdAt.toMillis ? a.createdAt.toMillis() : 0) : 0;
                    const timeB = b.createdAt ? (b.createdAt.toMillis ? b.createdAt.toMillis() : 0) : 0;
                    return timeB - timeA;
                });
                
                window.loadInventory();
            });
        }

        window.loadInventory = function() {
            const container = document.getElementById('adminProductList');
            const filterSize = document.getElementById('filterInventorySize').value;
            container.innerHTML = '';
            
            let displayProducts = allProductsRaw;
            if(filterSize !== 'ALL') {
                displayProducts = allProductsRaw.filter(p => String(p.size).trim() === filterSize);
            }
            
            document.getElementById('countAvailable').innerText = displayProducts.length;

            displayProducts.forEach((p) => {
                container.innerHTML += `
                    <div class="bg-white border border-gray-200 rounded-xl p-2 text-center shadow-sm flex flex-col justify-between relative group">
                        
                        <!-- CHECKBOX ĐỂ CHỌN NHIỀU ẢNH -->
                        <div class="absolute top-3 left-3 z-10">
                            <input type="checkbox" class="bulk-cb bg-white border-2 shadow" 
                                value="${p.id}" 
                                data-img="${p.img}" 
                                data-code="${p.code}" 
                                data-size="${p.size}" 
                                data-price="${p.price}"
                                onchange="updateSelectedCount()">
                        </div>

                        <div>
                            <div class="aspect-square bg-gray-50 rounded-lg overflow-hidden mb-2 relative cursor-pointer" onclick="openZoom('${p.img}')">
                                <img src="${p.img}" class="w-full h-full object-cover">
                                <div class="absolute inset-0 bg-black/30 flex items-center justify-center opacity-0 group-hover:opacity-100 transition"><i class="fas fa-search text-white text-xl"></i></div>
                            </div>
                            <div class="font-black text-sm text-gray-800">#${p.code}</div>
                            <div class="text-[11px] font-bold text-pink-600 bg-pink-50 py-0.5 rounded mt-1 border border-pink-100">Size ${p.size} • ${Number(p.price).toLocaleString('vi-VN')}đ</div>
                        </div>
                        
                        <div class="flex items-center gap-1 mt-3">
                            <button onclick="downloadImageWithText('${p.img}', '${p.code}', '${p.size}', ${p.price})" class="flex-1 text-[10px] sm:text-xs bg-green-50 text-green-600 hover:bg-green-100 py-1.5 rounded font-bold transition" title="Tải ảnh lẻ"><i class="fas fa-download"></i></button>
                            <button onclick="openEditModal('${p.id}', '${p.code}', '${p.size}', ${p.price})" class="flex-1 text-[10px] sm:text-xs bg-blue-50 text-blue-600 hover:bg-blue-100 py-1.5 rounded font-bold transition"><i class="fas fa-pen"></i></button>
                            <button onclick="deleteProduct('${p.id}')" class="flex-1 text-[10px] sm:text-xs bg-red-50 text-red-500 hover:bg-red-100 py-1.5 rounded font-bold transition"><i class="fas fa-trash"></i></button>
                        </div>
                    </div>
                `;
            });
            window.updateSelectedCount(); 
        }

        // TÍNH NĂNG CHỌN VÀ TẢI / XÓA HÀNG LOẠT
        window.updateSelectedCount = function() {
            const count = document.querySelectorAll('.bulk-cb:checked').length;
            const countEl = document.getElementById('selectedCount');
            const delCountEl = document.getElementById('deleteCount');
            if(countEl) countEl.innerText = count;
            if(delCountEl) delCountEl.innerText = count;
        }

        window.selectAllBulk = function() {
            const checkboxes = document.querySelectorAll('.bulk-cb');
            const allChecked = Array.from(checkboxes).every(cb => cb.checked);
            checkboxes.forEach(cb => cb.checked = !allChecked);
            window.updateSelectedCount();
        }

        window.deleteSelectedBulk = async function() {
            const checkedBoxes = document.querySelectorAll('.bulk-cb:checked');
            if (checkedBoxes.length === 0) {
                window.showAlert('Vui lòng tick chọn ít nhất 1 ảnh để xóa!');
                return;
            }

            window.showConfirm(`Bạn có chắc chắn muốn XÓA VĨNH VIỄN ${checkedBoxes.length} đôi giày đã chọn khỏi kho không?`, async () => {
                const btn = document.getElementById('btn-delete-bulk');
                btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Đang xóa...';
                btn.disabled = true;

                try {
                    let batch = writeBatch(db);
                    let count = 0;

                    for (let i = 0; i < checkedBoxes.length; i++) {
                        const id = checkedBoxes[i].value;
                        batch.delete(doc(db, "products", id));
                        count++;
                        
                        if (count === 400) {
                            await batch.commit();
                            batch = writeBatch(db);
                            count = 0;
                        }
                    }
                    
                    if (count > 0) {
                        await batch.commit();
                    }

                    window.showAlert(`✅ Đã xóa thành công ${checkedBoxes.length} sản phẩm!`);
                    window.updateSelectedCount();
                } catch (error) {
                    console.error("Lỗi khi xóa:", error);
                    window.showAlert("Có lỗi xảy ra khi xóa: " + error.message);
                } finally {
                    btn.innerHTML = `<i class="fas fa-trash-alt"></i> Xóa <span id="deleteCount" class="mx-0.5">0</span>`;
                    btn.disabled = false;
                }
            });
        }

        window.downloadSelectedBulk = async function() {
            const checkedBoxes = document.querySelectorAll('.bulk-cb:checked');
            if (checkedBoxes.length === 0) {
                window.showAlert('Vui lòng tick chọn ít nhất 1 ảnh để tải!');
                return;
            }

            const btn = document.getElementById('btn-download-bulk');
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Đang xử lý...';
            btn.disabled = true;

            for (let i = 0; i < checkedBoxes.length; i++) {
                const cb = checkedBoxes[i];
                await window.downloadImageWithText(
                    cb.getAttribute('data-img'), 
                    cb.getAttribute('data-code'), 
                    cb.getAttribute('data-size'), 
                    cb.getAttribute('data-price'),
                    true 
                );
                
                await new Promise(resolve => setTimeout(resolve, 400));
            }

            btn.innerHTML = `<i class="fas fa-download"></i> Tải <span id="selectedCount" class="mx-0.5">${checkedBoxes.length}</span>`;
            btn.disabled = false;
            
            document.querySelectorAll('.bulk-cb:checked').forEach(cb => cb.checked = false);
            window.updateSelectedCount();
            
            window.showAlert(`✅ Đã gửi lệnh tải ${checkedBoxes.length} ảnh! (Nếu trình duyệt hỏi "Allow download multiple files", hãy bấm Cho phép nhé)`);
        }


        // TÍNH NĂNG XÓA VÀ SỬA TỪNG SẢN PHẨM
        window.deleteProduct = function(id) {
            window.showConfirm('Chắc chắn xóa đôi này khỏi kho?', async () => {
                await deleteDoc(doc(db, "products", id));
            });
        }

        window.openEditModal = function(id, code, size, price) {
            document.getElementById('edit-id').value = id;
            document.getElementById('edit-code').value = code;
            document.getElementById('edit-size').value = size;
            document.getElementById('edit-price').value = price;
            document.getElementById('editModal').classList.remove('hidden');
        }

        window.closeEditModal = function() { document.getElementById('editModal').classList.add('hidden'); }

        window.saveEdit = async function() {
            const id = document.getElementById('edit-id').value;
            const code = document.getElementById('edit-code').value.toUpperCase().trim();
            const size = document.getElementById('edit-size').value.trim();
            const price = Number(document.getElementById('edit-price').value);

            if(!code || !size || !price) { window.showAlert('Vui lòng nhập đủ thông tin!'); return; }

            try {
                await updateDoc(doc(db, "products", id), { code: code, size: size, price: price });
                window.closeEditModal();
                window.showAlert('✅ Lưu thông tin thành công!');
            } catch (error) { window.showAlert('Lỗi cập nhật: ' + error.message); }
        }

        // TÍNH NĂNG WATERMARK CẢI TIẾN (ÉP SÁT ĐÁY)
        function drawRoundedRect(ctx, x, y, width, height, radius) {
            ctx.beginPath();
            ctx.moveTo(x + radius, y);
            ctx.lineTo(x + width - radius, y);
            ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
            ctx.lineTo(x + width, y + height - radius);
            ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
            ctx.lineTo(x + radius, y + height);
            ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
            ctx.lineTo(x, y + radius);
            ctx.quadraticCurveTo(x, y, x + radius, y);
            ctx.closePath();
            ctx.fill();
        }

        window.downloadImageWithText = function(imgUrl, code, size, price, isBulk = false) {
            return new Promise((resolve) => {
                const canvas = document.getElementById('watermarkCanvas');
                const ctx = canvas.getContext('2d');
                const img = new Image();
                
                img.crossOrigin = 'anonymous'; 
                const isBase64 = imgUrl.startsWith('data:image');
                img.src = isBase64 ? imgUrl : imgUrl + (imgUrl.includes('?') ? '&' : '?') + 'not-from-cache';

                img.onload = () => {
                    canvas.width = img.width;
                    canvas.height = img.height;

                    ctx.drawImage(img, 0, 0);

                    const text = `Mã: ${code} - Size: ${size} - Giá: ${Number(price).toLocaleString('vi-VN')}đ`;
                    const fontSize = Math.max(20, Math.floor(canvas.width / 28)); 
                    ctx.font = `bold ${fontSize}px sans-serif`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';

                    const textWidth = ctx.measureText(text).width;
                    const paddingX = fontSize * 1.5;
                    const paddingY = fontSize * 0.8;
                    
                    const boxWidth = textWidth + paddingX;
                    const boxHeight = fontSize + paddingY;
                    const x = canvas.width / 2;
                    
                    const y = canvas.height - (boxHeight / 2) - 15; 
                    
                    ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
                    drawRoundedRect(ctx, x - (boxWidth / 2), y - (boxHeight / 2), boxWidth, boxHeight, boxHeight / 2.5);

                    ctx.fillStyle = '#FFFFFF';
                    ctx.fillText(text, x, y + (fontSize * 0.05));

                    const link = document.createElement('a');
                    link.download = `BeXiu_${code}_Size${size}.jpg`;
                    link.href = canvas.toDataURL('image/jpeg', 0.95);
                    link.click();
                    resolve(true);
                };

                img.onerror = () => {
                    if(!isBulk) window.showAlert('Trình duyệt chặn ghép chữ. Hệ thống sẽ tải ảnh gốc!');
                    const link = document.createElement('a');
                    link.download = `BeXiu_${code}.jpg`;
                    link.href = imgUrl;
                    link.target = '_blank';
                    link.click();
                    resolve(false);
                };
            });
        }
