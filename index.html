<meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Admin - Tiệm giày Bé Xíu</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <style>
        /* Ẩn thanh cuộn nhưng vẫn cuộn được */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Style riêng cho checkbox chọn ảnh */
        .bulk-cb { width: 22px; height: 22px; cursor: pointer; accent-color: #ec4899; }
    </style>
</head>
<body class="bg-gray-100 text-gray-800">

    <!-- KHUNG ĐĂNG NHẬP -->
    <div id="loginSection" class="min-h-screen flex items-center justify-center px-4">
        <div class="bg-white p-8 rounded-2xl shadow-xl max-w-sm w-full text-center">
            <div class="w-20 h-20 bg-gray-100 rounded-full mx-auto flex items-center justify-center mb-4 border-4 border-gray-200">
                <i class="fas fa-lock text-3xl text-gray-400"></i>
            </div>
            <h2 class="text-2xl font-bold mb-6 text-gray-700">Quản Trị Viên</h2>
            <input type="password" id="passCode" placeholder="Nhập mã pin..." class="w-full text-center p-3 border-2 border-gray-200 rounded-xl mb-4 text-xl tracking-widest focus:border-blue-500 focus:outline-none">
            <button onclick="checkLogin()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl transition">Đăng Nhập</button>
        </div>
    </div>

    <!-- GIAO DIỆN ADMIN CHÍNH -->
    <div id="adminPanel" class="hidden max-w-5xl mx-auto pb-20">
        
        <!-- Header -->
        <div class="bg-white shadow-sm p-4 sticky top-0 z-50 border-b flex justify-between items-center">
            <div class="font-bold text-lg text-blue-800"><i class="fas fa-shoe-prints mr-2"></i> Admin Bé Xíu</div>
            <a href="index.html" class="text-sm bg-gray-100 px-3 py-1.5 rounded-lg hover:bg-gray-200 font-bold"><i class="fas fa-external-link-alt"></i> Ra trang chủ</a>
        </div>

        <!-- Điều hướng Tabs -->
        <div class="flex bg-white px-2 mt-2 gap-2 shadow-sm rounded-lg mx-2 p-1 border">
            <button onclick="switchTab('uploadTab')" id="btn-uploadTab" class="flex-1 py-2.5 text-sm font-bold bg-blue-50 text-blue-600 rounded-md transition border border-blue-200"><i class="fas fa-plus-circle mr-1"></i> Đăng Giày</button>
            <button onclick="switchTab('inventoryTab')" id="btn-inventoryTab" class="flex-1 py-2.5 text-sm font-bold text-gray-500 hover:bg-gray-50 rounded-md transition"><i class="fas fa-box mr-1"></i> Kho Hàng</button>
            <button onclick="switchTab('orderTab')" id="btn-orderTab" class="flex-1 py-2.5 text-sm font-bold text-gray-500 hover:bg-gray-50 rounded-md transition"><i class="fas fa-list-alt mr-1"></i> Đơn Hàng</button>
        </div>

        <!-- TAB 1: ĐĂNG GIÀY MỚI -->
        <div id="uploadTab" class="p-4 tab-content block">
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-200">
                <h3 class="font-bold text-lg mb-4 border-b pb-2"><i class="fas fa-upload text-blue-500"></i> Đăng Sản Phẩm Mới</h3>
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <!-- Trái: Ảnh -->
                    <div>
                        <label class="block text-sm font-semibold mb-2 text-gray-700">1. Ảnh sản phẩm:</label>
                        <div class="relative border-2 border-dashed border-pink-300 bg-pink-50 rounded-2xl p-6 flex flex-col items-center justify-center hover:bg-pink-100 transition cursor-pointer min-h-[250px]" onclick="document.getElementById('imageInput').click()">
                            <input type="file" id="imageInput" accept="image/*" class="hidden" onchange="previewImage(this)">
                            
                            <div id="uploadPrompt" class="text-center">
                                <i class="fas fa-cloud-upload-alt text-5xl text-pink-400 mb-3"></i>
                                <p class="text-sm font-bold text-pink-600">Bấm để chọn ảnh</p>
                                <p class="text-xs text-gray-500 mt-1">Ảnh sẽ tự động hiển thị vuông</p>
                            </div>
                            
                            <div id="previewContainer" class="hidden w-full h-full relative">
                                <img id="imgPreview" src="" class="w-full aspect-square object-contain bg-white rounded-xl border border-gray-200 shadow-sm p-1">
                                <button onclick="event.stopPropagation(); clearImage()" class="absolute -top-3 -right-3 bg-white text-red-500 rounded-full w-8 h-8 flex items-center justify-center shadow-md border border-gray-100 hover:bg-red-50 transition" title="Đổi ảnh khác">
                                    <i class="fas fa-times"></i>
                                </button>
                            </div>
                        </div>
                    </div>

                    <!-- Phải: Thông tin -->
                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm font-semibold mb-2 text-gray-700">2. Mã giày (Tự động):</label>
                            <div class="flex gap-2">
                                <input type="text" id="shoeCode" readonly class="w-full p-2.5 border border-gray-300 rounded-lg uppercase bg-gray-100 font-bold text-gray-600 cursor-not-allowed">
                                <button onclick="document.getElementById('shoeCode').value = generateRandomCode()" class="bg-gray-200 hover:bg-gray-300 px-4 rounded-lg transition" title="Tạo mã ngẫu nhiên mới">
                                    <i class="fas fa-sync-alt text-gray-600"></i>
                                </button>
                            </div>
                        </div>

                        <div>
                            <label class="block text-sm font-semibold mb-2 text-gray-700">3. Chọn Size:</label>
                            <div class="grid grid-cols-5 gap-1.5" id="sizeOptions">
                                <!-- JS sẽ render các nút chọn size vào đây -->
                            </div>
                        </div>

                        <div class="bg-amber-50 border border-amber-200 p-3 rounded-lg flex items-center gap-2 cursor-pointer hover:bg-amber-100 transition" onclick="toggleSpecialBrand()">
                            <input type="checkbox" id="isSpecialBrand" class="w-5 h-5 text-amber-600 rounded pointer-events-none">
                            <label class="font-bold text-sm text-amber-800 pointer-events-none">🌟 Hàng Vans/Converse (Đồng giá 350k)</label>
                        </div>

                        <div>
                            <label class="block text-sm font-semibold mb-2 text-gray-700">4. Giá tiền (Tự động):</label>
                            <div class="relative">
                                <input type="number" id="shoePrice" class="w-full p-2.5 border border-gray-300 rounded-lg font-black text-pink-600 bg-gray-100 text-lg" readonly>
                                <span class="absolute right-4 top-2.5 font-bold text-gray-400">VNĐ</span>
                            </div>
                            <p class="text-[11px] text-gray-500 mt-1.5 font-semibold">Tự động: ≤35.5 (180k) | 36 - 36.5 (230k) | ≥37 (260k)</p>
                        </div>

                        <button id="btnUpload" onclick="uploadProduct()" class="w-full bg-black hover:bg-gray-800 text-white font-bold py-3.5 rounded-xl shadow-lg transition mt-4">
                            <i class="fas fa-cloud-upload-alt mr-2"></i> Đăng Lên Web
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- TAB 2: QUẢN LÝ KHO -->
        <div id="inventoryTab" class="p-4 tab-content hidden">
            <!-- THANH CÔNG CỤ: Lọc Size & Đồng bộ Giá & Tải Hàng Loạt -->
            <div class="flex flex-col md:flex-row justify-between md:items-center bg-white p-3 rounded-xl shadow-sm border border-gray-200 mb-4 gap-3">
                <div class="flex items-center gap-2 font-bold text-gray-700 whitespace-nowrap">
                    <i class="fas fa-boxes text-blue-500"></i> Kho: <span id="countAvailable" class="text-red-500">0</span>
                </div>
                
                <div class="flex flex-wrap items-center gap-2 w-full md:w-auto justify-end">
                    <select id="filterInventorySize" onchange="loadInventory()" class="p-2 border border-gray-300 rounded-lg text-sm bg-gray-50 flex-1 md:flex-none font-semibold focus:outline-none focus:border-blue-500">
                        <option value="ALL">Tất cả Size</option>
                        <!-- Options sẽ được gen bằng JS -->
                    </select>
                    
                    <button onclick="selectAllBulk()" class="bg-gray-200 hover:bg-gray-300 text-gray-800 text-xs font-bold py-2 px-3 rounded-lg transition">
                        Chọn tất cả
                    </button>
                    <button id="btn-download-bulk" onclick="downloadSelectedBulk()" class="bg-green-600 hover:bg-green-700 text-white text-xs font-bold py-2 px-3 rounded-lg shadow transition flex items-center justify-center gap-1">
                        <i class="fas fa-download"></i> Tải <span id="selectedCount" class="mx-0.5">0</span>
                    </button>
                    <button onclick="syncAllPrices()" class="bg-yellow-500 hover:bg-yellow-600 text-white text-xs px-3 py-2 rounded-lg font-bold shadow transition flex items-center gap-1">
                        <i class="fas fa-sync-alt"></i> Đồng bộ giá
                    </button>
                </div>
            </div>

            <div id="adminProductList" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-3">
                <!-- Data load ở đây -->
            </div>
        </div>

        <!-- TAB 3: QUẢN LÝ ĐƠN HÀNG -->
        <div id="orderTab" class="p-4 tab-content hidden">
            <button onclick="testTelegramBot()" class="w-full bg-blue-100 text-blue-700 py-3 rounded-lg font-bold mb-4 border border-blue-200 active:bg-blue-200">
                <i class="fab fa-telegram-plane mr-1"></i> Test thử Bot Telegram
            </button>
            <h3 class="font-bold mb-3 text-gray-700">Lịch sử Chốt Đơn</h3>
            <div id="adminOrderList" class="space-y-3">
                <!-- Data load ở đây -->
            </div>
        </div>

    </div>

    <!-- MODAL CHỈNH SỬA SẢN PHẨM -->
    <div id="editModal" class="fixed inset-0 bg-black bg-opacity-60 z-[100] hidden flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white rounded-2xl w-full max-w-sm p-5 shadow-2xl relative">
            <button onclick="closeEditModal()" class="absolute top-3 right-3 text-gray-400 hover:text-gray-800">
                <i class="fas fa-times text-xl"></i>
            </button>
            <h3 class="font-bold text-lg mb-4 text-gray-800 border-b pb-2"><i class="fas fa-edit text-orange-500"></i> Sửa thông tin giày</h3>
            
            <input type="hidden" id="edit-id">
            <div class="space-y-3">
                <div>
                    <label class="block text-xs font-bold text-gray-600 mb-1">Mã giày</label>
                    <input type="text" id="edit-code" class="w-full border border-gray-300 p-2.5 rounded-lg bg-gray-50 font-bold uppercase focus:border-blue-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-600 mb-1">Size</label>
                    <input type="text" id="edit-size" class="w-full border border-gray-300 p-2.5 rounded-lg bg-gray-50 font-bold focus:border-blue-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-600 mb-1">Giá bán (VNĐ)</label>
                    <input type="number" id="edit-price" class="w-full border border-gray-300 p-2.5 rounded-lg bg-gray-50 font-black text-pink-600 focus:border-blue-500 outline-none text-lg">
                </div>
            </div>
            
            <div class="flex gap-2 mt-6">
                <button onclick="closeEditModal()" class="flex-1 bg-gray-100 text-gray-700 font-bold py-3 rounded-xl hover:bg-gray-200">Hủy bỏ</button>
                <button onclick="saveEdit()" class="flex-1 bg-black text-white font-bold py-3 rounded-xl shadow-lg hover:bg-gray-800 flex items-center justify-center gap-2">
                    <i class="fas fa-save"></i> Lưu lại
                </button>
            </div>
        </div>
    </div>

    <!-- CANVAS DÙNG ĐỂ RENDER ẢNH WATERMARK (ẨN) -->
    <canvas id="watermarkCanvas" class="hidden"></canvas>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, serverTimestamp, query, orderBy, deleteDoc, doc, updateDoc, getDocs, writeBatch, limit } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        // FIREBASE CONFIG CŨ CỦA BẠN
        const fbP1 = "AIzaSyCVAm"; const fbP2 = "JO1KViXVg3"; const fbP3 = "kizelTp6CZ"; const fbP4 = "AFmJLkKiM";
        const firebaseConfig = {
            apiKey: fbP1 + fbP2 + fbP3 + fbP4,
            authDomain: "donggia-8ef8e.firebaseapp.com", 
            projectId: "donggia-8ef8e",
            storageBucket: "donggia-8ef8e.firebasestorage.app", 
            messagingSenderId: "186638607487",
            appId: "1:186638607487:web:9fe74d79311b0f43d70b4a"
        };
        
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        let allProductsRaw = [];

        // 1. CHỨC NĂNG ĐĂNG NHẬP
        window.checkLogin = function() {
            if(document.getElementById('passCode').value === '3119') {
                document.getElementById('loginSection').classList.add('hidden');
                document.getElementById('adminPanel').classList.remove('hidden');
                window.initAdmin();
            } else {
                alert('Sai mật khẩu!');
            }
        }

        // Cấu hình Size
        const sizes = ['Kid','33','33.5','34','34.5','35','35.5','36','36.5','37','37.5','38','38.5','39','39.5','40+'];

        window.initAdmin = function() {
            // Khởi tạo nút size đăng giày
            const sizeContainer = document.getElementById('sizeOptions');
            const filterSelect = document.getElementById('filterInventorySize');

            sizes.forEach(s => {
                let div = document.createElement('div');
                div.className = "text-center";
                div.innerHTML = `
                    <input type="radio" name="size" id="size_${s}" value="${s}" class="peer hidden" onchange="autoCalcPrice()">
                    <label for="size_${s}" class="block py-1.5 border border-gray-300 rounded cursor-pointer peer-checked:bg-blue-500 peer-checked:text-white peer-checked:border-blue-500 text-sm font-medium transition hover:bg-gray-50">${s}</label>
                `;
                sizeContainer.appendChild(div);

                if(filterSelect.options.length <= 16) { 
                    let opt = document.createElement('option');
                    opt.value = s;
                    opt.textContent = "Chỉ lọc Size " + s;
                    filterSelect.appendChild(opt);
                }
            });
            
            document.getElementById('shoeCode').value = window.generateRandomCode();
            
            window.fetchInventoryData();
            window.loadOrders();
        }
        
        window.generateRandomCode = function() {
            const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ";
            const c1 = chars[Math.floor(Math.random() * chars.length)];
            const c2 = chars[Math.floor(Math.random() * chars.length)];
            const digits = String(Math.floor(100 + Math.random() * 900));
            return `${c1}${c2}${digits}`;
        }

        // 2. LOGIC TÍNH GIÁ
        window.toggleSpecialBrand = function() {
            const cb = document.getElementById('isSpecialBrand');
            cb.checked = !cb.checked;
            window.autoCalcPrice();
        }

        window.autoCalcPrice = function() {
            const isSpecial = document.getElementById('isSpecialBrand').checked;
            const sizeInput = document.querySelector('input[name="size"]:checked');
            const priceInput = document.getElementById('shoePrice');
            
            if (isSpecial) {
                priceInput.value = 350000;
                return;
            }
            
            if (sizeInput) {
                let sVal = sizeInput.value;
                let sNum = parseFloat(sVal);
                
                if (sVal === 'Kid' || sNum <= 35.5) priceInput.value = 180000;
                else if (sNum === 36 || sNum === 36.5) priceInput.value = 230000;
                else if (sNum >= 37) priceInput.value = 260000;
                else priceInput.value = 0;
            }
        }

        // 3. UPLOAD ẢNH & DATA
        window.previewImage = function(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('imgPreview').src = e.target.result;
                    document.getElementById('previewContainer').classList.remove('hidden');
                    document.getElementById('uploadPrompt').classList.add('hidden');
                }
                reader.readAsDataURL(input.files[0]);
            }
        }

        window.clearImage = function() {
            document.getElementById('imageInput').value = '';
            document.getElementById('imgPreview').src = '';
            document.getElementById('uploadPrompt').classList.remove('hidden');
            document.getElementById('previewContainer').classList.add('hidden');
        }

        window.uploadProduct = async function() {
            const code = document.getElementById('shoeCode').value.toUpperCase().trim();
            const sizeInput = document.querySelector('input[name="size"]:checked');
            const price = parseInt(document.getElementById('shoePrice').value);
            const imgFile = document.getElementById('imageInput').files[0];
            const btn = document.getElementById('btnUpload');

            if(!code || !sizeInput || !price || !imgFile) {
                alert('Vui lòng điền đủ Mã, Size, Giá và chọn Ảnh!');
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Đang tải lên...';

            try {
                const ikPriv1 = "ayTs6CE91Z"; const ikPriv2 = "pBtxpipgz2"; const ikPriv3 = "GmpKdjU=";
                const IK_PRIVATE_KEY = "private_" + ikPriv1 + ikPriv2 + ikPriv3;
                const IK_UPLOAD_ENDPOINT = "https://upload.imagekit.io/api/v1/files/upload";
                const IK_AUTH = "Basic " + btoa(IK_PRIVATE_KEY + ":");
                
                const formData = new FormData();
                formData.append("file", imgFile, `giay-${code}.jpg`); 
                formData.append("fileName", `giay-${code}.jpg`); 
                formData.append("folder", "/giay2hand");
                
                const res = await fetch(IK_UPLOAD_ENDPOINT, { 
                    method: "POST", 
                    headers: { "Authorization": IK_AUTH }, 
                    body: formData 
                });
                const ikData = await res.json();
                
                if (!ikData.url) throw new Error("Lỗi tải ảnh lên ImageKit");
                
                await addDoc(collection(db, "products"), {
                    code: code,
                    size: sizeInput.value,
                    price: price,
                    imageUrl: ikData.url,
                    images: [ikData.url],
                    status: 'available',
                    createdAt: serverTimestamp()
                });

                alert('✅ Đã đăng thành công!');
                
                document.getElementById('shoeCode').value = window.generateRandomCode();
                window.clearImage();
                if(sizeInput) sizeInput.checked = false;
                document.getElementById('shoePrice').value = '';
                document.getElementById('isSpecialBrand').checked = false;
                
            } catch (err) {
                console.error(err);
                alert('Lỗi: ' + err.message);
            }
            
            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-cloud-upload-alt mr-2"></i> Đăng Lên Web';
        }

        window.switchTab = function(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.querySelectorAll('[id^="btn-"]').forEach(btn => {
                btn.className = "flex-1 py-2.5 text-sm font-bold text-gray-500 hover:bg-gray-50 rounded-md transition";
            });
            
            document.getElementById(tabId).classList.remove('hidden');
            document.getElementById('btn-' + tabId).className = "flex-1 py-2.5 text-sm font-bold bg-blue-50 text-blue-600 rounded-md transition border border-blue-200";
        }

        window.getOptimizedImageUrl = function(url, width = 400) {
            if (!url) return '';
            if (url.includes('ik.imagekit.io') && !url.includes('tr=')) return `${url}?tr=w-${width},f-webp,q-85`;
            return url;
        }

        window.fetchInventoryData = function() {
            onSnapshot(collection(db, "products"), (snapshot) => {
                allProductsRaw = [];
                snapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    if(data.status === 'available' || !data.isSold) {
                        const img = (data.images && data.images.length > 0) ? data.images[0] : data.imageUrl;
                        allProductsRaw.push({ id: docSnap.id, ...data, img: img });
                    }
                });
                
                allProductsRaw.sort((a, b) => {
                    const timeA = a.createdAt ? (a.createdAt.toMillis ? a.createdAt.toMillis() : 0) : 0;
                    const timeB = b.createdAt ? (b.createdAt.toMillis ? b.createdAt.toMillis() : 0) : 0;
                    return timeB - timeA;
                });
                
                window.loadInventory();
            });
        }

        window.loadInventory = function() {
            const container = document.getElementById('adminProductList');
            const filterSize = document.getElementById('filterInventorySize') ? document.getElementById('filterInventorySize').value : 'ALL';
            container.innerHTML = '';
            
            let displayProducts = allProductsRaw;
            if(filterSize !== 'ALL') {
                displayProducts = allProductsRaw.filter(p => String(p.size).trim() === filterSize);
            }
            
            document.getElementById('countAvailable').innerText = displayProducts.length;

            displayProducts.forEach((p) => {
                container.innerHTML += `
                    <div class="bg-white border border-gray-200 rounded-lg p-2 text-center shadow-sm flex flex-col justify-between relative group">
                        
                        <div class="absolute top-3 left-3 z-10">
                            <input type="checkbox" class="bulk-cb bg-white border-2 shadow" 
                                value="${p.id}" 
                                data-img="${p.img}" 
                                data-code="${p.code}" 
                                data-size="${p.size}" 
                                data-price="${p.price}"
                                onchange="updateSelectedCount()">
                        </div>

                        <div>
                            <div class="aspect-square bg-gray-50 rounded-lg overflow-hidden mb-2 relative cursor-pointer" onclick="window.open('${p.img}', '_blank')">
                                <img src="${window.getOptimizedImageUrl(p.img, 200)}" class="w-full h-full object-cover">
                                <div class="absolute inset-0 bg-black/30 flex items-center justify-center opacity-0 group-hover:opacity-100 transition"><i class="fas fa-search text-white text-xl"></i></div>
                            </div>
                            <div class="font-bold text-sm text-red-600">#${p.code} <span class="text-xs text-gray-500 font-semibold ml-1">Sz ${p.size}</span></div>
                            <div class="font-bold text-xs text-gray-800">${(p.price || 0).toLocaleString('vi-VN')}đ</div>
                        </div>
                        
                        <div class="flex items-center gap-1 mt-3">
                            <button onclick="downloadImageWithText('${p.img}', '${p.code}', '${p.size}', ${p.price})" class="flex-1 text-[10px] sm:text-xs bg-green-50 text-green-600 hover:bg-green-100 py-1.5 rounded font-bold shadow-sm" title="Tải ảnh lẻ"><i class="fas fa-download"></i></button>
                            <button onclick="openEditModal('${p.id}', '${p.code}', '${p.size}', ${p.price})" class="flex-1 text-[10px] sm:text-xs bg-blue-50 text-blue-600 hover:bg-blue-100 py-1.5 rounded font-bold shadow-sm"><i class="fas fa-pen"></i></button>
                            <button onclick="deleteProduct('${p.id}')" class="flex-1 text-[10px] sm:text-xs bg-red-50 text-red-500 hover:bg-red-500 hover:text-white py-1.5 rounded font-bold transition"><i class="fas fa-trash"></i></button>
                        </div>
                    </div>
                `;
            });
            window.updateSelectedCount();
        }

        window.updateSelectedCount = function() {
            const count = document.querySelectorAll('.bulk-cb:checked').length;
            const countEl = document.getElementById('selectedCount');
            if(countEl) countEl.innerText = count;
        }

        window.selectAllBulk = function() {
            const checkboxes = document.querySelectorAll('.bulk-cb');
            const allChecked = Array.from(checkboxes).every(cb => cb.checked);
            checkboxes.forEach(cb => cb.checked = !allChecked);
            window.updateSelectedCount();
        }

        window.downloadSelectedBulk = async function() {
            const checkedBoxes = document.querySelectorAll('.bulk-cb:checked');
            if (checkedBoxes.length === 0) {
                alert('Vui lòng tick chọn ít nhất 1 ảnh để tải!');
                return;
            }

            const btn = document.getElementById('btn-download-bulk');
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Đang xử lý...';
            btn.disabled = true;

            for (let i = 0; i < checkedBoxes.length; i++) {
                const cb = checkedBoxes[i];
                await window.downloadImageWithText(
                    cb.getAttribute('data-img'), 
                    cb.getAttribute('data-code'), 
                    cb.getAttribute('data-size'), 
                    cb.getAttribute('data-price'),
                    true 
                );
                await new Promise(resolve => setTimeout(resolve, 400));
            }

            btn.innerHTML = `<i class="fas fa-download"></i> Tải <span id="selectedCount" class="mx-0.5">${checkedBoxes.length}</span>`;
            btn.disabled = false;
            
            document.querySelectorAll('.bulk-cb:checked').forEach(cb => cb.checked = false);
            window.updateSelectedCount();
            
            alert(`✅ Đã gửi lệnh tải ${checkedBoxes.length} ảnh! (Nhớ cấp quyền tải nhiều file nếu trình duyệt hỏi)`);
        }

            if(confirm('Chắc chắn xóa đôi này khỏi kho?')) {
                deleteDoc(doc(db, "products", id));

        window.openEditModal = function(id, code, size, price) {
            document.getElementById('edit-id').value = id;

        window.saveEdit = async function() {
            const id = document.getElementById('edit-id').value;
            const code = document.getElementById('edit-code').value.toUpperCase().trim();
            const size = document.getElementById('edit-size').value.trim();
            const price = Number(document.getElementById('edit-price').value);

            if(!code || !size || !price) { alert('Vui lòng nhập đủ thông tin!'); return; }

            try {
                await updateDoc(doc(db, "products", id), { code: code, size: size, price: price });
                window.closeEditModal();
                alert('✅ Lưu thông tin thành công!');
            } catch (error) { alert('Lỗi cập nhật: ' + error.message); }
        }

        window.drawRoundedRect = function(ctx, x, y, width, height, radius) {
            ctx.beginPath();
            ctx.moveTo(x + radius, y);
            ctx.lineTo(x + width - radius, y);
            ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
            ctx.lineTo(x + width, y + height - radius);
            ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
            ctx.lineTo(x + radius, y + height);
            ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
            ctx.lineTo(x, y + radius);
            ctx.quadraticCurveTo(x, y, x + radius, y);
            ctx.closePath();
            ctx.fill();
        }

        window.downloadImageWithText = function(imgUrl, code, size, price, isBulk = false) {
            return new Promise((resolve) => {
                const canvas = document.getElementById('watermarkCanvas');
                const ctx = canvas.getContext('2d');
                const img = new Image();
                
                img.crossOrigin = 'anonymous'; 
                const isBase64 = imgUrl.startsWith('data:image');
                img.src = isBase64 ? imgUrl : imgUrl + (imgUrl.includes('?') ? '&' : '?') + 'not-from-cache';

                img.onload = () => {
                    canvas.width = img.width;
                    canvas.height = img.height;

                    ctx.drawImage(img, 0, 0);

                    const text = `Mã: ${code} - Size: ${size} - Giá: ${Number(price).toLocaleString('vi-VN')}đ`;
                    const fontSize = Math.max(20, Math.floor(canvas.width / 28)); 
                    ctx.font = `bold ${fontSize}px sans-serif`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';

                    const textWidth = ctx.measureText(text).width;
                    const paddingX = fontSize * 1.5;
                    const paddingY = fontSize * 0.8;
                    
                    const boxWidth = textWidth + paddingX;
                    const boxHeight = fontSize + paddingY;
                    const x = canvas.width / 2;
                    
                    const y = canvas.height - (boxHeight / 2) - 15; 
                    
                    ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
                    window.drawRoundedRect(ctx, x - (boxWidth / 2), y - (boxHeight / 2), boxWidth, boxHeight, boxHeight / 2.5);

                    ctx.fillStyle = '#FFFFFF';
                    ctx.fillText(text, x, y + (fontSize * 0.05));

                    const link = document.createElement('a');
                    link.download = `BeXiu_${code}_Size${size}.jpg`;
                    link.href = canvas.toDataURL('image/jpeg', 0.95);
                    link.click();
                    resolve(true);
                };

                img.onerror = () => {
                    if(!isBulk) alert('Trình duyệt chặn ghép chữ do lỗi bảo mật CORS. Hệ thống sẽ tải ảnh gốc!');
                    const link = document.createElement('a');
                    link.download = `BeXiu_${code}.jpg`;
                    link.href = imgUrl;
                    link.target = '_blank';
                    link.click();
                    resolve(false);
                };
            });
        }

        window.syncAllPrices = async function() {
            if(!confirm('Tính năng này sẽ tự động chạy qua toàn bộ Kho Hàng (chưa bán) và thiết lập lại giá chuẩn mới nhất:\n• Size <= 35.5: 180k\n• Size 36 và 36.5: 230k\n• Size >= 37: 260k\n\n(Lưu ý: Hàng Vans/Converse giá 350k sẽ được GIỮ NGUYÊN).\n\nBẠN CÓ CHẮC CHẮN MUỐN ĐỒNG BỘ KHÔNG?')) return;
            
            try {
                const batch = writeBatch(db); 
                const snapshot = await getDocs(collection(db, "products"));
                let updatedCount = 0;

                snapshot.forEach(docSnap => {
                    const data = docSnap.data();
                    
                    if(data.status === 'available' || !data.status || !data.isSold) {
                        let isSpecial = (data.price === 350000); 
                        
                        if(!isSpecial) {
                            let newPrice = 0;
                            let sVal = data.size || '';
                            let sNum = parseFloat(sVal);
                            
                            if (sVal === 'Kid' || sNum <= 35.5) newPrice = 180000;
                            else if (sNum === 36 || sNum === 36.5) newPrice = 230000;
                            else if (sNum >= 37) newPrice = 260000;
                            
                            if(newPrice > 0 && data.price !== newPrice) {
                                batch.update(docSnap.ref, { price: newPrice });
                                updatedCount++;
                            }
                        }
                    }
                });

                if(updatedCount > 0) {
                    await batch.commit();
                    alert(`✅ HOÀN TẤT!\nĐã tự động sửa lại giá cho ${updatedCount} đôi giày.`);
                    window.loadInventory(); 
                } else {
                    alert('tuyệt vời! Toàn bộ tủ giày của bạn đều đang ở mức giá chuẩn, không cần đồng bộ thêm.');
                }

            } catch(error) {
                console.error("Lỗi đồng bộ giá:", error);
                alert("Lỗi khi đồng bộ giá: " + error.message);
            }
        }


        window.loadOrders = function() {
            const q = query(collection(db, "orders"), orderBy("timestamp", "desc"), limit(30));
            onSnapshot(q, (snapshot) => {
                const container = document.getElementById('adminOrderList');
                container.innerHTML = '';
                snapshot.forEach(docSnap => {
                    const data = docSnap.data();
                    const date = data.timestamp ? (data.timestamp.toDate ? data.timestamp.toDate().toLocaleString('vi-VN') : 'Mới') : 'Mới';
                    container.innerHTML += `
                        <div class="bg-white p-3 rounded-xl border border-gray-200 shadow-sm flex flex-col md:flex-row justify-between gap-2">
                            <div>
                                <span class="bg-yellow-100 text-yellow-800 text-xs px-2 py-0.5 rounded font-bold mb-1 inline-block">${date}</span>
                                <div class="font-bold text-gray-800 text-sm">👤 ${data.customerName} - 📞 ${data.customerPhone}</div>
                                <div class="text-sm text-gray-600 mt-0.5">📍 ${data.address || 'Không có'}</div>
                                <div class="text-sm font-semibold text-red-600 mt-1">👟 ${data.productCode} (Size ${data.size}) - ${(data.price || 0).toLocaleString('vi-VN')}đ</div>
                            </div>

                            </div>

                    `;
                });
            });
