            <div class="bg-white p-3 rounded-xl shadow-sm border border-gray-200 mb-4 flex flex-col md:flex-row gap-3 items-start md:items-center justify-between">

                        Chọn tất cả
                    </button>
                    <button id="btn-download-bulk" onclick="downloadSelectedBulk()" class="bg-green-600 hover:bg-green-700 text-white text-xs font-bold py-2 px-3 rounded-lg shadow transition flex items-center justify-center gap-1">

            <h3 class="font-bold mb-3 text-gray-700 text-sm">Lịch sử Yêu cầu tư vấn & Chốt đơn</h3>
            <div id="adminOrderList" class="space-y-3">
                <!-- Data load ở đây -->
            </div>
        </div>

    <!-- MODAL CHỈNH SỬA SẢN PHẨM -->
    <div id="editModal" class="fixed inset-0 bg-black bg-opacity-60 z-[100] hidden flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white rounded-2xl w-full max-w-sm p-5 shadow-2xl relative">
            <button onclick="closeEditModal()" class="absolute top-3 right-3 text-gray-400 hover:text-gray-800">
                <i class="fas fa-times text-xl"></i>
            </button>
            <h3 class="font-bold text-lg mb-4 text-gray-800 border-b pb-2"><i class="fas fa-edit text-orange-500"></i> Sửa thông tin giày</h3>
            
            <input type="hidden" id="edit-id">
            <div class="space-y-3">
                <div>
                    <label class="block text-xs font-bold text-gray-600 mb-1">Mã giày</label>
                    <input type="text" id="edit-code" class="w-full border border-gray-300 p-2.5 rounded-lg bg-gray-50 font-bold uppercase focus:border-blue-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-600 mb-1">Size</label>
                    <input type="text" id="edit-size" class="w-full border border-gray-300 p-2.5 rounded-lg bg-gray-50 font-bold focus:border-blue-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-600 mb-1">Giá bán (VNĐ)</label>
                    <input type="number" id="edit-price" class="w-full border border-gray-300 p-2.5 rounded-lg bg-gray-50 font-black text-pink-600 focus:border-blue-500 outline-none text-lg">
                </div>
            </div>
            
            <div class="flex gap-2 mt-6">
                <button onclick="closeEditModal()" class="flex-1 bg-gray-100 text-gray-700 font-bold py-3 rounded-xl hover:bg-gray-200">Hủy bỏ</button>
                <button onclick="saveEdit()" class="flex-1 bg-black text-white font-bold py-3 rounded-xl shadow-lg hover:bg-gray-800 flex items-center justify-center gap-2">
                    <i class="fas fa-save"></i> Lưu lại
                </button>
            </div>

    <!-- CANVAS DÙNG ĐỂ RENDER ẢNH WATERMARK VÀ NÉN ẢNH (ẨN) -->
    <canvas id="watermarkCanvas" class="hidden"></canvas>

    <script>
        // ==========================================
        // DÁN CONFIG FIREBASE CỦA BẠN VÀO ĐÂY
        const firebaseConfig = {
            apiKey: "AIzaSyCVAm" + "JO1KViXVg3" + "kizelTp6CZ" + "AFmJLkKiM",
            authDomain: "donggia-8ef8e.firebaseapp.com",
            projectId: "donggia-8ef8e",
            storageBucket: "donggia-8ef8e.firebasestorage.app"
        };
        // ==========================================
        
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        let allProductsRaw = [];

        // 1. ĐĂNG NHẬP
        function checkLogin() {
            if(document.getElementById('passCode').value === '3119') {
                document.getElementById('loginSection').classList.add('hidden');
                document.getElementById('adminPanel').classList.remove('hidden');
                initAdmin();
            } else { alert('Sai mật khẩu!'); }
        }

        const sizes = ['Kid','33','33.5','34','34.5','35','35.5','36','36.5','37','37.5','38','38.5','39','39.5','40+'];

        function initAdmin() {
            const sizeContainer = document.getElementById('sizeOptions');
            const filterSizeSelect = document.getElementById('filterInventorySize');
            
            sizes.forEach(s => {
                sizeContainer.innerHTML += `
                    <div class="text-center">
                        <input type="radio" name="size" id="size_${s}" value="${s}" class="peer hidden" onchange="autoCalcPrice()">
                        <label for="size_${s}" class="block py-1.5 border border-gray-300 rounded-lg cursor-pointer peer-checked:bg-pink-500 peer-checked:text-white peer-checked:border-pink-500 text-[11px] font-bold transition hover:bg-gray-100">${s}</label>
                    </div>
                `;
                if(s !== 'Kid') filterSizeSelect.innerHTML += `<option value="${s}">Size ${s}</option>`;
            });
            
            fetchInventoryData();
            loadOrders();
        }

        function toggleSpecialBrand() {
            const cb = document.getElementById('isSpecialBrand');
            cb.checked = !cb.checked;
            autoCalcPrice();
        }

        function autoCalcPrice() {
            const isSpecial = document.getElementById('isSpecialBrand').checked;
            const sizeInput = document.querySelector('input[name="size"]:checked');
            const priceInput = document.getElementById('shoePrice');
            
            if (isSpecial) { priceInput.value = 350000; return; }
            if (sizeInput) {
                let sVal = sizeInput.value;
                let sNum = parseFloat(sVal);
                if (sVal === 'Kid' || sNum <= 35.5) priceInput.value = 180000;
                else if (sNum === 36 || sNum === 36.5) priceInput.value = 230000;
                else if (sNum >= 37) priceInput.value = 260000;
                else priceInput.value = 0;
            }
        }

        function previewImage(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('imgPreview').src = e.target.result;
                    document.getElementById('imgPreview').classList.remove('hidden');
                    document.getElementById('imgPlaceholder').classList.add('hidden');
                }
                reader.readAsDataURL(input.files[0]);
            }
        }

        // --- BỘ NÉN ẢNH TỰ ĐỘNG ---
        function compressImage(file, maxDimension, quality) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        let width = img.width;
                        let height = img.height;
                        
                        // Tính toán kích thước nén
                        if (width > height && width > maxDimension) {
                            height = Math.round((height * maxDimension) / width);
                            width = maxDimension;
                        } else if (height >= width && height > maxDimension) {
                            width = Math.round((width * maxDimension) / height);
                            height = maxDimension;
                        }

                        const canvas = document.createElement('canvas');
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        
                        // Trả về Base64 đã được nén siêu nhẹ
                        resolve(canvas.toDataURL('image/jpeg', quality));
                    };
                    img.onerror = (e) => reject(e);
                };
                reader.onerror = (e) => reject(e);
            });
        }

        async function uploadProduct() {
            const code = document.getElementById('shoeCode').value.toUpperCase().trim();
            const sizeInput = document.querySelector('input[name="size"]:checked');
            const price = parseInt(document.getElementById('shoePrice').value);
            const imgFile = document.getElementById('imageInput').files[0];
            const btn = document.getElementById('btnUpload');

            if(!code || !sizeInput || !price || !imgFile) { alert('Điền đủ Mã, Size, Giá và Ảnh nhé!'); return; }

            btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Đang nén ảnh & tải lên...';

            try {
                // TỰ ĐỘNG NÉN ẢNH TRƯỚC KHI TẢI LÊN
                // Giảm ảnh từ 2.8MB xuống giới hạn 1000px, chất lượng 80% (Ra file khoảng 100-150KB)
                const compressedBase64 = await compressImage(imgFile, 1000, 0.8);

                await db.collection("products").add({
                    code: code, size: sizeInput.value, price: price,
                    imageUrl: compressedBase64, images: [compressedBase64], status: 'available',
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });
                
                alert('✅ Đăng thành công! Ảnh đã được nén tối ưu để tiết kiệm dung lượng.');
                
                document.getElementById('shoeCode').value = '';
                document.getElementById('imageInput').value = '';
                document.getElementById('imgPreview').classList.add('hidden');
                document.getElementById('imgPlaceholder').classList.remove('hidden');
                if(sizeInput) sizeInput.checked = false;
                document.getElementById('shoePrice').value = '';
                document.getElementById('isSpecialBrand').checked = false;
                
                btn.disabled = false; btn.innerHTML = '<i class="fas fa-cloud-upload-alt"></i> Tự Động Nén & Đăng';
            } catch (err) {
                alert('Lỗi: ' + err.message);
                btn.disabled = false; btn.innerHTML = 'Đăng Lỗi - Thử Lại';
            }
        }

        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.querySelectorAll('[id^="btn-"]').forEach(btn => btn.className = "flex-1 py-2 text-sm font-bold text-gray-500 hover:bg-gray-50 rounded-md transition");
            document.getElementById(tabId).classList.remove('hidden');
            document.getElementById('btn-' + tabId).className = "flex-1 py-2 text-sm font-bold bg-pink-50 text-pink-600 rounded-md transition";
        }

        // KHO HÀNG & LỌC
        function fetchInventoryData() {
            db.collection("products").onSnapshot((snapshot) => {
                allProductsRaw = [];
                snapshot.forEach((doc) => {
                    const data = doc.data();
                    if(data.status === 'available' || !data.isSold) {
                        const img = (data.images && data.images.length > 0) ? data.images[0] : data.imageUrl;
                        allProductsRaw.push({ id: doc.id, ...data, img: img });
                    }
                });
                
                allProductsRaw.sort((a, b) => {
                    const timeA = a.createdAt ? a.createdAt.toMillis() : 0;
                    const timeB = b.createdAt ? b.createdAt.toMillis() : 0;
                    return timeB - timeA;
                });
                
                loadInventory();
            });
        }

        function loadInventory() {
            const container = document.getElementById('adminProductList');
            const filterSize = document.getElementById('filterInventorySize').value;
            container.innerHTML = '';
            
            let displayProducts = allProductsRaw;
            if(filterSize !== 'ALL') {
                displayProducts = allProductsRaw.filter(p => String(p.size).trim() === filterSize);
            }
            
            document.getElementById('countAvailable').innerText = displayProducts.length;

            displayProducts.forEach((p) => {
                container.innerHTML += `
                    <div class="bg-white border border-gray-200 rounded-xl p-2 text-center shadow-sm flex flex-col justify-between relative group">
                        
                        <div class="absolute top-3 left-3 z-10">
                            <input type="checkbox" class="bulk-cb bg-white border-2 shadow" 
                                value="${p.id}" data-img="${p.img}" data-code="${p.code}" 
                                data-size="${p.size}" data-price="${p.price}" onchange="updateSelectedCount()">
                        </div>

                        <div>
                            <div class="aspect-square bg-gray-50 rounded-lg overflow-hidden mb-2 relative cursor-pointer" onclick="openZoom('${p.img}')">
                                <img src="${p.img}" class="w-full h-full object-cover">
                                <div class="absolute inset-0 bg-black/30 flex items-center justify-center opacity-0 group-hover:opacity-100 transition"><i class="fas fa-search text-white text-xl"></i></div>
                            </div>
                            <div class="font-black text-sm text-gray-800">#${p.code}</div>
                            <div class="text-[11px] font-bold text-pink-600 bg-pink-50 py-0.5 rounded mt-1">Size ${p.size} • ${Number(p.price).toLocaleString('vi-VN')}đ</div>
                        </div>
                        
                        <div class="flex items-center gap-1 mt-3">
                            <button onclick="downloadImageWithText('${p.img}', '${p.code}', '${p.size}', ${p.price})" class="flex-1 text-[10px] sm:text-xs bg-green-50 text-green-600 hover:bg-green-100 py-1.5 rounded font-bold shadow-sm" title="Tải ảnh lẻ"><i class="fas fa-download"></i></button>
                            <button onclick="openEditModal('${p.id}', '${p.code}', '${p.size}', ${p.price})" class="flex-1 text-[10px] sm:text-xs bg-blue-50 text-blue-600 hover:bg-blue-100 py-1.5 rounded font-bold shadow-sm"><i class="fas fa-pen"></i></button>
                            <button onclick="deleteProduct('${p.id}')" class="flex-1 text-[10px] sm:text-xs bg-red-50 text-red-500 hover:bg-red-100 py-1.5 rounded font-bold shadow-sm"><i class="fas fa-trash"></i></button>
                        </div>
                    </div>
                `;
            });
            updateSelectedCount(); 
        }

        // CHỌN VÀ TẢI HÀNG LOẠT
        function updateSelectedCount() {
            const count = document.querySelectorAll('.bulk-cb:checked').length;
            document.getElementById('selectedCount').innerText = count;
        }

        function selectAllBulk() {
            const checkboxes = document.querySelectorAll('.bulk-cb');
            const allChecked = Array.from(checkboxes).every(cb => cb.checked);
            checkboxes.forEach(cb => cb.checked = !allChecked);
            updateSelectedCount();
        }

        async function downloadSelectedBulk() {
            const checkedBoxes = document.querySelectorAll('.bulk-cb:checked');
            if (checkedBoxes.length === 0) {
                alert('Vui lòng tick chọn ít nhất 1 ảnh để tải!');
                return;
            }

            const btn = document.getElementById('btn-download-bulk');
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Đang xử lý...';
            btn.disabled = true;

            for (let i = 0; i < checkedBoxes.length; i++) {
                const cb = checkedBoxes[i];
                await downloadImageWithText(
                    cb.getAttribute('data-img'), 
                    cb.getAttribute('data-code'), 
                    cb.getAttribute('data-size'), 
                    cb.getAttribute('data-price'),
                    true
                );
                await new Promise(resolve => setTimeout(resolve, 400));
            }

            btn.innerHTML = `<i class="fas fa-download"></i> Tải <span id="selectedCount" class="mx-0.5">${checkedBoxes.length}</span> ảnh`;
            btn.disabled = false;
            
            document.querySelectorAll('.bulk-cb:checked').forEach(cb => cb.checked = false);
            updateSelectedCount();
            
            alert(`✅ Đã gửi lệnh tải ${checkedBoxes.length} ảnh!`);
        }


        // XÓA VÀ SỬA
        function deleteProduct(id) {
            if(confirm('Chắc chắn xóa đôi này khỏi kho?')) db.collection("products").doc(id).delete();
        }

        function openEditModal(id, code, size, price) {
            document.getElementById('edit-id').value = id;
            document.getElementById('edit-code').value = code;
            document.getElementById('edit-size').value = size;
            document.getElementById('edit-price').value = price;
            document.getElementById('editModal').classList.remove('hidden');
        }

        function closeEditModal() { document.getElementById('editModal').classList.add('hidden'); }

        async function saveEdit() {
            const id = document.getElementById('edit-id').value;
            const code = document.getElementById('edit-code').value.toUpperCase().trim();
            const size = document.getElementById('edit-size').value.trim();
            const price = Number(document.getElementById('edit-price').value);

            if(!code || !size || !price) { alert('Vui lòng nhập đủ thông tin!'); return; }

            try {
                await db.collection("products").doc(id).update({ code: code, size: size, price: price });
                closeEditModal();
                alert('✅ Lưu thông tin thành công!');
            } catch (error) { alert('Lỗi cập nhật: ' + error.message); }
        }

        // TẢI ẢNH ĐÓNG DẤU
        function drawRoundedRect(ctx, x, y, width, height, radius) {
            ctx.beginPath();
            ctx.moveTo(x + radius, y);
            ctx.lineTo(x + width - radius, y);
            ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
            ctx.lineTo(x + width, y + height - radius);
            ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
            ctx.lineTo(x + radius, y + height);
            ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
            ctx.lineTo(x, y + radius);
            ctx.quadraticCurveTo(x, y, x + radius, y);
            ctx.closePath();
            ctx.fill();
        }

        function downloadImageWithText(imgUrl, code, size, price, isBulk = false) {
            return new Promise((resolve) => {
                const canvas = document.getElementById('watermarkCanvas');
                const ctx = canvas.getContext('2d');
                const img = new Image();
                
                img.crossOrigin = 'anonymous'; 
                const isBase64 = imgUrl.startsWith('data:image');
                img.src = isBase64 ? imgUrl : imgUrl + (imgUrl.includes('?') ? '&' : '?') + 'not-from-cache';

                img.onload = () => {
                    canvas.width = img.width;
                    canvas.height = img.height;

                    ctx.drawImage(img, 0, 0);

                    const text = `Mã: ${code} - Size: ${size} - Giá: ${Number(price).toLocaleString('vi-VN')}đ`;
                    const fontSize = Math.max(20, Math.floor(canvas.width / 28)); 
                    ctx.font = `bold ${fontSize}px sans-serif`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';

                    const textWidth = ctx.measureText(text).width;
                    const paddingX = fontSize * 1.5;
                    const paddingY = fontSize * 0.8;
                    
                    const boxWidth = textWidth + paddingX;
                    const boxHeight = fontSize + paddingY;
                    const x = canvas.width / 2;
                    
                    // ÉP SÁT ĐÁY ĐỂ KHÔNG PHẠM VÀO GIÀY
                    const y = canvas.height - (boxHeight / 2) - 15; 
                    
                    ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
                    drawRoundedRect(ctx, x - (boxWidth / 2), y - (boxHeight / 2), boxWidth, boxHeight, boxHeight / 2.5);

                    ctx.fillStyle = '#FFFFFF';
                    ctx.fillText(text, x, y + (fontSize * 0.05));

                    const link = document.createElement('a');
                    link.download = `BeXiu_${code}_Size${size}.jpg`;
                    link.href = canvas.toDataURL('image/jpeg', 0.95);
                    link.click();
                    resolve(true);
                };

                img.onerror = () => {
                    if(!isBulk) alert('Trình duyệt chặn ghép chữ do lỗi bảo mật CORS. Hệ thống sẽ tải ảnh gốc!');
                    const link = document.createElement('a');
                    link.download = `BeXiu_${code}.jpg`;
                    link.href = imgUrl;
                    link.target = '_blank';
                    link.click();
                    resolve(false);
                };
            });
        }

        // ĐỒNG BỘ GIÁ HÀNG LOẠT
        async function executeBatchPriceUpdate() {
            if(!confirm("Đồng bộ giá tự động: ≤35.5 (180k) | 36-36.5 (230k) | ≥37 (260k)? Các đôi 350k sẽ bị cập nhật lại trừ khi bạn sửa tay.")) return;
            
            try {
                const snapshot = await db.collection("products").where("status", "==", "available").get();
                let batch = db.batch();
                let count = 0;
                let updated = 0;

                snapshot.forEach(doc => {
                    const data = doc.data();
                    const sNum = parseFloat(data.size);
                    let newPrice = 0;

                    if(String(data.size).toLowerCase() === 'kid' || sNum <= 35.5) newPrice = 180000;
                    else if (sNum === 36 || sNum === 36.5) newPrice = 230000;
                    else if (sNum >= 37) newPrice = 260000;

                    if(newPrice !== 0 && data.price !== newPrice && data.price !== 350000) {
                        batch.update(doc.ref, { price: newPrice });
                        updated++;
                        count++;
                    }

                    if (count === 400) { batch.commit(); batch = db.batch(); count = 0; }
                });

                if(count > 0) await batch.commit();
                alert(`✅ Xong! Đã quét và cập nhật lại giá chuẩn cho ${updated} đôi giày.`);
            } catch (error) { alert("Lỗi đồng bộ: " + error.message); }
        }
