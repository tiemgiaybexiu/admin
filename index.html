<!DOCTYPE html>
<html lang="vi">
<head>

</head>

    <!-- ADMIN DASHBOARD -->

        <div class="max-w-5xl mx-auto p-4 sm:p-6">
            <div class="flex items-center justify-between pb-4 mb-6 border-b border-rose-100 sticky top-0 bg-[#FAFAFA]/95 backdrop-blur-md z-20 pt-2">

            </div>

            <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 mb-6">

                </div>
                <div class="bg-emerald-50 border border-emerald-200 p-4 rounded-2xl cursor-pointer" onclick="window.switchAdminTab('orders')">

            <div class="flex gap-2 mb-6 bg-rose-50 p-1.5 rounded-2xl border border-rose-100">

                <button onclick="window.switchAdminTab('orders')" id="adm-tab-orders" class="flex-1 py-2.5 rounded-xl text-xs sm:text-sm font-extrabold text-gray-700 hover:text-brand-rose transition">2. Đơn hàng (<span id="adm-tab-order-badge">0</span>)</button>
            </div>

            <!-- TAB 1: UPLOAD -->
            <div id="admin-tab-content-upload" class="space-y-8">
                <div class="bg-white p-4 sm:p-6 rounded-3xl border border-rose-100 shadow-xs">
                    <h3 class="text-base font-extrabold text-brand-dark mb-4">Đăng Sản Phẩm Mới</h3>
                    
                    <div class="mb-5 p-4 bg-rose-50/50 rounded-2xl border border-dashed border-rose-300 text-center">
                        <label class="text-xs font-extrabold text-brand-dark flex items-center justify-center gap-1.5 mb-3">
                            <i class="ph-fill ph-image text-brand-rose text-base"></i> Chọn ảnh sản phẩm
                        </label>
                        
                        <div class="aspect-square bg-white border border-gray-200 rounded-2xl relative overflow-hidden w-full max-w-[240px] mx-auto shadow-sm group" id="box-img-single">
                            <label class="absolute inset-0 flex flex-col items-center justify-center cursor-pointer hover:bg-gray-50 transition">
                                <div class="w-12 h-12 rounded-full bg-rose-50 text-brand-rose flex items-center justify-center mb-2">
                                    <i class="ph-bold ph-plus text-xl"></i>
                                </div>
                                <span class="text-xs font-bold text-gray-500 group-hover:text-brand-rose transition">Tải ảnh lên</span>
                                <input type="file" accept="image/*" class="hidden" onchange="window.handleSelectImage(this)">
                            </label>
                            <img src="" class="w-full h-full object-cover hidden absolute inset-0 z-10" id="preview-single">
                            <button onclick="window.removeImage()" class="hidden absolute top-2 right-2 z-20 w-8 h-8 bg-black/60 text-white rounded-full flex justify-center items-center text-sm shadow-md hover:bg-black/80 transition" id="del-single"><i class="ph-bold ph-trash"></i></button>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-5">
                        <div class="space-y-2.5">
                            <div>
                                <label class="block text-xs font-extrabold text-gray-700 mb-1">Mã Code (Tự tạo):</label>
                                <div class="flex gap-1.5">
                                    <input type="text" id="upload-code" readonly class="w-full bg-gray-50 border border-gray-200 rounded-xl p-2.5 text-sm font-black text-brand-rose outline-none">
                                    <button type="button" onclick="window.regenerateAdminCode()" class="px-3 rounded-xl bg-gray-100 hover:bg-rose-100 text-gray-700 font-extrabold"><i class="ph-bold ph-arrows-clockwise"></i></button>
                                </div>
                            </div>
                            <div>
                                <label class="block text-xs font-extrabold text-gray-700 mb-1">Giá bán (Tự nhảy theo Size):</label>
                                <input type="number" id="upload-price" class="w-full bg-gray-50 border border-gray-200 rounded-xl p-2.5 text-sm font-black outline-none focus:border-brand-rose">
                            </div>
                        </div>

                        <div>
                            <div class="flex items-center justify-between mb-2">
                                <label class="text-xs font-extrabold text-gray-700">Chọn Size / Nửa Size:</label>
                                <span id="auto-group-badge" class="text-[10px] font-extrabold bg-gray-100 px-2 py-0.5 rounded">...</span>
                            </div>
                            <div class="grid grid-cols-4 sm:grid-cols-5 gap-1.5" id="upload-size-radios">
                                <label class="flex items-center justify-center cursor-pointer bg-gray-50 py-1.5 rounded-lg border border-gray-200 hover:border-brand-rose"><input type="radio" name="upsize" value="Kid" onchange="window.updatePriceBySize(this.value)" class="hidden"><span class="text-[11px] font-extrabold">Kid</span></label>
                                <label class="flex items-center justify-center cursor-pointer bg-gray-50 py-1.5 rounded-lg border border-gray-200 hover:border-brand-rose"><input type="radio" name="upsize" value="33" onchange="window.updatePriceBySize(this.value)" class="hidden"><span class="text-[11px] font-extrabold">33</span></label>
                                <label class="flex items-center justify-center cursor-pointer bg-gray-50 py-1.5 rounded-lg border border-gray-200 hover:border-brand-rose"><input type="radio" name="upsize" value="33.5" onchange="window.updatePriceBySize(this.value)" class="hidden"><span class="text-[11px] font-extrabold">33.5</span></label>
                                <label class="flex items-center justify-center cursor-pointer bg-gray-50 py-1.5 rounded-lg border border-gray-200 hover:border-brand-rose"><input type="radio" name="upsize" value="34" onchange="window.updatePriceBySize(this.value)" class="hidden"><span class="text-[11px] font-extrabold">34</span></label>
                                <label class="flex items-center justify-center cursor-pointer bg-gray-50 py-1.5 rounded-lg border border-gray-200 hover:border-brand-rose"><input type="radio" name="upsize" value="34.5" onchange="window.updatePriceBySize(this.value)" class="hidden"><span class="text-[11px] font-extrabold">34.5</span></label>
                                <label class="flex items-center justify-center cursor-pointer bg-gray-50 py-1.5 rounded-lg border border-gray-200 hover:border-brand-rose"><input type="radio" name="upsize" value="35" onchange="window.updatePriceBySize(this.value)" class="hidden"><span class="text-[11px] font-extrabold">35</span></label>
                                <label class="flex items-center justify-center cursor-pointer bg-gray-50 py-1.5 rounded-lg border border-gray-200 hover:border-brand-rose"><input type="radio" name="upsize" value="35.5" onchange="window.updatePriceBySize(this.value)" class="hidden"><span class="text-[11px] font-extrabold">35.5</span></label>
                                <label class="flex items-center justify-center cursor-pointer bg-gray-50 py-1.5 rounded-lg border border-gray-200 hover:border-brand-rose"><input type="radio" name="upsize" value="36" onchange="window.updatePriceBySize(this.value)" checked class="hidden"><span class="text-[11px] font-extrabold text-brand-rose">36</span></label>
                                <label class="flex items-center justify-center cursor-pointer bg-gray-50 py-1.5 rounded-lg border border-gray-200 hover:border-brand-rose"><input type="radio" name="upsize" value="36.5" onchange="window.updatePriceBySize(this.value)" class="hidden"><span class="text-[11px] font-extrabold">36.5</span></label>
                                <label class="flex items-center justify-center cursor-pointer bg-gray-50 py-1.5 rounded-lg border border-gray-200 hover:border-brand-rose"><input type="radio" name="upsize" value="37" onchange="window.updatePriceBySize(this.value)" class="hidden"><span class="text-[11px] font-extrabold">37</span></label>
                                <label class="flex items-center justify-center cursor-pointer bg-gray-50 py-1.5 rounded-lg border border-gray-200 hover:border-brand-rose"><input type="radio" name="upsize" value="37.5" onchange="window.updatePriceBySize(this.value)" class="hidden"><span class="text-[11px] font-extrabold">37.5</span></label>
                                <label class="flex items-center justify-center cursor-pointer bg-gray-50 py-1.5 rounded-lg border border-gray-200 hover:border-brand-rose"><input type="radio" name="upsize" value="38" onchange="window.updatePriceBySize(this.value)" class="hidden"><span class="text-[11px] font-extrabold">38</span></label>
                                <label class="flex items-center justify-center cursor-pointer bg-gray-50 py-1.5 rounded-lg border border-gray-200 hover:border-brand-rose"><input type="radio" name="upsize" value="38.5" onchange="window.updatePriceBySize(this.value)" class="hidden"><span class="text-[11px] font-extrabold">38.5</span></label>
                            </div>
                            <input type="text" id="upload-custom-size" placeholder="Hoặc size người lớn (vd: 39, 40)..." class="w-full bg-white border border-gray-200 rounded-xl mt-2 p-2 text-xs font-bold outline-none focus:border-brand-rose" oninput="window.handleCustomSizeInput(this.value)">
                        </div>
                    </div>

                    <button id="upload-btn" onclick="window.handleUploadProduct()" class="w-full bg-brand-rose hover:bg-rose-700 text-white font-extrabold text-sm py-3.5 rounded-2xl shadow-md transition">Đăng Giày Lên Kho</button>
                    <div id="upload-status" class="text-center text-xs mt-2.5 font-extrabold h-4"></div>
                </div>

                <div class="bg-white p-4 sm:p-6 rounded-3xl border border-rose-100">
                    <h3 class="text-base font-extrabold text-brand-dark mb-4">Kho Hàng Hiện Tại</h3>
                    <div id="admin-product-list" class="grid grid-cols-2 sm:grid-cols-4 lg:grid-cols-5 gap-3"></div>
                </div>
            </div>

            <!-- TAB 2: ĐƠN HÀNG -->
            <div id="admin-tab-content-orders" class="hidden space-y-4">
                <div class="bg-white p-4 sm:p-6 rounded-3xl border border-rose-100">
                    <h3 class="text-base font-extrabold text-brand-dark mb-4">Danh Sách Khách Đặt Hàng & Tư Vấn</h3>
                    <div id="admin-orders-list" class="space-y-3"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modals (Edit, Delete, Toast) -->
    <div id="admin-edit-modal" class="fixed inset-0 z-50 hidden bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl p-6 max-w-sm w-full shadow-2xl">
            <h3 class="text-base font-extrabold mb-3">Sửa Giày</h3>
            <div class="space-y-3">
                <input type="text" id="edit-code" class="w-full bg-gray-50 border border-gray-200 rounded-xl p-2 text-xs font-bold">
                <input type="text" id="edit-size" class="w-full bg-gray-50 border border-gray-200 rounded-xl p-2 text-xs font-bold" placeholder="Size (Ví dụ: 36.5)">
                <input type="number" id="edit-price" class="w-full bg-gray-50 border border-gray-200 rounded-xl p-2 text-xs font-bold" placeholder="Giá">
            </div>
            <div class="flex gap-2 mt-4">
                <button onclick="document.getElementById('admin-edit-modal').classList.add('hidden')" class="flex-1 py-2 bg-gray-100 rounded-xl text-xs font-bold">Hủy</button>
                <button onclick="window.saveProductEdit()" class="flex-1 py-2 bg-brand-rose text-white rounded-xl text-xs font-bold">Lưu</button>
            </div>
        </div>
    </div>
    <div id="custom-confirm-modal" class="fixed inset-0 z-50 hidden bg-black/60 flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl p-6 text-center shadow-2xl max-w-xs w-full">
            <h4 class="text-base font-bold text-red-600 mb-4">Xóa sản phẩm này?</h4>
            <div class="flex gap-2">
                <button onclick="window.closeConfirmDelete()" class="flex-1 py-2 bg-gray-100 rounded-xl text-xs font-bold">Hủy</button>
                <button onclick="window.executeDeleteProduct()" class="flex-1 py-2 bg-red-600 text-white rounded-xl text-xs font-bold">Xóa</button>
            </div>
        </div>
    </div>
    <div id="toast-container" class="fixed bottom-6 right-6 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc, updateDoc, serverTimestamp, query, orderBy, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const fbP1 = "AIzaSyCVAm"; const fbP2 = "JO1KViXVg3"; const fbP3 = "kizelTp6CZ"; const fbP4 = "AFmJLkKiM";
        const firebaseConfig = {
            apiKey: fbP1 + fbP2 + fbP3 + fbP4,
            authDomain: "donggia-8ef8e.firebaseapp.com", projectId: "donggia-8ef8e",
            storageBucket: "donggia-8ef8e.firebasestorage.app", messagingSenderId: "186638607487",
            appId: "1:186638607487:web:9fe74d79311b0f43d70b4a"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const ikPriv1 = "ayTs6CE91Z"; const ikPriv2 = "pBtxpipgz2"; const ikPriv3 = "GmpKdjU=";
        const IK_PRIVATE_KEY = "private_" + ikPriv1 + ikPriv2 + ikPriv3;
        const IK_UPLOAD_ENDPOINT = "https://upload.imagekit.io/api/v1/files/upload";
        const IK_AUTH = "Basic " + btoa(IK_PRIVATE_KEY + ":");

        let firebaseProducts = [];
        let ordersAndLeads = [];
        let pendingDeleteId = null;
        let currentEditId = null;
        let selectedUploadFile = null;

        const formatMoney = (amount) => Number(amount || 0).toLocaleString('vi-VN') + 'đ';
        const getOptimizedImageUrl = (url, width = 600) => {
            if (!url) return '';
            if (url.includes('ik.imagekit.io') && !url.includes('tr=')) return `${url}?tr=w-${width},f-webp,q-85`;
            return url;
        };

        window.generateRandomShoeCode = () => {
            const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ";
            const c1 = chars[Math.floor(Math.random() * chars.length)];
            const c2 = chars[Math.floor(Math.random() * chars.length)];
            const digits = String(Math.floor(100 + Math.random() * 900));
            return `${c1}${c2}${digits}`;
        };
        window.regenerateAdminCode = () => { document.getElementById('upload-code').value = window.generateRandomShoeCode(); };

        window.handleSizeAutoGroup = (s) => {
            const badge = document.getElementById('auto-group-badge');
            if(s === 'Kid') badge.textContent = "🎒 Kid";
            else if(Number(s) <= 35.5) badge.textContent = "🎒 Học sinh";
            else if(Number(s) >= 39) badge.textContent = "👨 Người lớn";
            else badge.textContent = "👩 Nữ";
        };

        window.updatePriceBySize = (size) => {
            document.getElementById('upload-custom-size').value = '';
            const pInput = document.getElementById('upload-price');
            document.querySelectorAll('input[name="upsize"]').forEach(r => {
                r.nextElementSibling.classList.remove('text-brand-rose');
                if(r.checked) r.nextElementSibling.classList.add('text-brand-rose');
            });

            if (size === 'Kid') pInput.value = 150000;
            else if (Number(size) <= 35.5) pInput.value = 190000;
            else pInput.value = 250000;
            window.handleSizeAutoGroup(size); 
        };

        window.handleCustomSizeInput = (val) => {
            document.querySelectorAll('input[name="upsize"]').forEach(r => {
                r.checked = false; r.nextElementSibling.classList.remove('text-brand-rose');
            });
            const s = Number(val);
            if(s) {
                const pInput = document.getElementById('upload-price');
                if (s <= 35.5) pInput.value = 190000;
                else pInput.value = 250000;
            }
            window.handleSizeAutoGroup(s);
        };

        const showToast = (title, msg) => {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'bg-brand-dark/95 text-white p-3 rounded-xl shadow-lg animate-fade-up text-xs';
            toast.innerHTML = `<strong>${title}</strong><br>${msg}`;
            container.appendChild(toast);
            setTimeout(() => { toast.remove(); }, 3000);
        };

        window.checkAdminPass = () => {
            if (document.getElementById('pass-input').value === '3119') {
                document.getElementById('password-modal').classList.add('hidden');
                document.getElementById('admin-section').classList.remove('hidden');
                window.regenerateAdminCode();
                window.updatePriceBySize(36);
                listenRealtimeData();
                loadStatsForAdmin();
            } else { document.getElementById('pass-error').classList.remove('hidden'); }
        };

        window.switchAdminTab = (tab) => {
            document.getElementById('adm-tab-upload').className = tab === 'upload' ? "flex-1 py-2.5 rounded-xl text-xs sm:text-sm font-extrabold bg-brand-rose text-white shadow-xs transition" : "flex-1 py-2.5 rounded-xl text-xs sm:text-sm font-extrabold text-gray-700 hover:text-brand-rose transition";
            document.getElementById('adm-tab-orders').className = tab === 'orders' ? "flex-1 py-2.5 rounded-xl text-xs sm:text-sm font-extrabold bg-brand-rose text-white shadow-xs transition" : "flex-1 py-2.5 rounded-xl text-xs sm:text-sm font-extrabold text-gray-700 hover:text-brand-rose transition";
            document.getElementById('admin-tab-content-upload').classList.toggle('hidden', tab !== 'upload');
            document.getElementById('admin-tab-content-orders').classList.toggle('hidden', tab !== 'orders');
        };

        async function loadStatsForAdmin() {
            try {
                const vnTime = new Date(new Date().getTime() + (7 * 3600000));
                const dayKey = `${vnTime.getUTCFullYear()}-${String(vnTime.getUTCMonth() + 1).padStart(2, '0')}-${String(vnTime.getUTCDate()).padStart(2, '0')}`;
                const monthKey = `${vnTime.getUTCFullYear()}-${String(vnTime.getUTCMonth() + 1).padStart(2, '0')}`;
                const docSnap = await getDoc(doc(db, 'analytics', 'views'));
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    document.getElementById('stat-today').innerText = data[dayKey] || 0;
                    document.getElementById('stat-month').innerText = data[monthKey] || 0;
                }
            } catch (e) {}
        }

        function listenRealtimeData() {
            onSnapshot(query(collection(db, "products"), orderBy("createdAt", "desc")), (snapshot) => {
                firebaseProducts = [];
                snapshot.forEach((d) => firebaseProducts.push({ id: d.id, ...d.data() }));
                document.getElementById('stat-total-shoes').innerText = firebaseProducts.length;
                renderAdminProductList();
            });
            onSnapshot(query(collection(db, "orders"), orderBy("createdAt", "desc")), (snapshot) => {
                ordersAndLeads = [];
                snapshot.forEach((d) => ordersAndLeads.push({ id: d.id, ...d.data() }));
                document.getElementById('stat-total-orders').innerText = ordersAndLeads.length;
                document.getElementById('adm-tab-order-badge').innerText = ordersAndLeads.length;
                renderAdminOrdersList();
            });
        }

        // CHỌN 1 ẢNH (Bỏ tính năng ghép)
        window.handleSelectImage = (input) => {
            if(input.files && input.files[0]) {
                selectedUploadFile = input.files[0];
                const url = URL.createObjectURL(input.files[0]);
                document.getElementById(`preview-single`).src = url;
                document.getElementById(`preview-single`).classList.remove('hidden');
                document.getElementById(`del-single`).classList.remove('hidden');
            }
        };
        
        window.removeImage = () => {
            selectedUploadFile = null;
            document.getElementById(`preview-single`).classList.add('hidden');
            document.getElementById(`del-single`).classList.add('hidden');
            document.getElementById(`box-img-single`).querySelector('input').value = '';
        };

        window.handleUploadProduct = async () => {
            if(!selectedUploadFile) { showToast('Thiếu ảnh', 'Vui lòng chọn 1 ảnh để đăng!'); return; }
            
            const code = document.getElementById('upload-code').value || window.generateRandomShoeCode();
            const customSize = document.getElementById('upload-custom-size').value.trim();
            const sizeRadio = document.querySelector('input[name="upsize"]:checked');
            const size = customSize ? customSize : (sizeRadio ? sizeRadio.value : '36');
            const price = parseInt(document.getElementById('upload-price').value);
            const btn = document.getElementById('upload-btn');
            
            btn.disabled = true; btn.innerText = "Đang tải ảnh lên...";
            try {
                const fd = new FormData();
                fd.append("file", selectedUploadFile, `giay-${code}.jpg`); 
                fd.append("fileName", `giay-${code}.jpg`); 
                fd.append("folder", "/giay2hand");
                
                const res = await fetch(IK_UPLOAD_ENDPOINT, { method: "POST", headers: { "Authorization": IK_AUTH }, body: fd });
                const ikData = await res.json();
                
                await addDoc(collection(db, "products"), {
                    code, size, price, imageUrl: ikData.url, images: [ikData.url],
                    isSold: false, createdAt: serverTimestamp()
                });
                showToast('Đăng thành công!', `Mã #${code} đã lên kho.`);
                window.regenerateAdminCode();
                window.removeImage();
            } catch (e) { showToast('Lỗi', e.message); }
            btn.disabled = false; btn.innerText = "Đăng Giày Lên Kho";
        };

        const renderAdminProductList = () => {
            const c = document.getElementById('admin-product-list');
            c.innerHTML = '';
            firebaseProducts.forEach(item => {
                c.insertAdjacentHTML('beforeend', `
                    <div class="bg-rose-50/50 p-2 rounded-xl border border-rose-100 flex flex-col">
                        <img src="${getOptimizedImageUrl(item.imageUrl, 200)}" class="w-full aspect-square object-cover rounded-lg bg-white mb-2">
                        <div class="flex items-center justify-between mb-1">
                            <h5 class="text-xs font-black">#${item.code}</h5>
                            <span class="text-[10px] font-bold text-brand-rose bg-white px-1.5 rounded border border-rose-100">Sz ${item.size}</span>
                        </div>
                        <p class="text-xs font-black text-brand-rose mb-2">${formatMoney(item.price)}</p>
                        <div class="grid grid-cols-3 gap-1 mt-auto">
                            <button onclick="window.toggleSold('${item.id}', ${item.isSold})" class="py-1 rounded text-[10px] font-bold ${item.isSold ? 'bg-gray-200 text-gray-700' : 'bg-emerald-100 text-emerald-800'}">${item.isSold ? 'Mở' : 'Đã bán'}</button>
                            <button onclick="window.editProduct('${item.id}', '${item.code}', '${item.size}', ${item.price})" class="py-1 bg-blue-100 text-blue-700 rounded text-[10px] font-bold">Sửa</button>
                            <button onclick="window.requestDelete('${item.id}')" class="py-1 bg-red-100 text-red-700 rounded text-[10px] font-bold">Xóa</button>
                        </div>
                    </div>`);
            });
        };

        window.toggleSold = async (id, current) => { await updateDoc(doc(db, "products", id), { isSold: !current }); };
        window.editProduct = (id, c, s, p) => {
            currentEditId = id; document.getElementById('edit-code').value = c; document.getElementById('edit-size').value = s;
            document.getElementById('edit-price').value = p; document.getElementById('admin-edit-modal').classList.remove('hidden');
        };
        window.saveProductEdit = async () => {
            if(!currentEditId) return;
            const c = document.getElementById('edit-code').value; const s = document.getElementById('edit-size').value;
            const p = parseInt(document.getElementById('edit-price').value);
            await updateDoc(doc(db, "products", currentEditId), { code: c, size: s, price: p });
            document.getElementById('admin-edit-modal').classList.add('hidden'); showToast('Đã lưu', 'Cập nhật thành công');
        };
        window.requestDelete = (id) => { pendingDeleteId = id; document.getElementById('custom-confirm-modal').classList.remove('hidden'); };
        window.closeConfirmDelete = () => { pendingDeleteId = null; document.getElementById('custom-confirm-modal').classList.add('hidden'); };
        window.executeDeleteProduct = async () => {
            if(pendingDeleteId) { await deleteDoc(doc(db, "products", pendingDeleteId)); window.closeConfirmDelete(); showToast('Đã xóa', 'Sản phẩm đã xóa'); }
        };

        window.updateOrderStatus = async (id, st) => { await updateDoc(doc(db, "orders", id), { status: st }); };
        window.updateOrderNote = async (id) => {
            const note = document.getElementById(`note-${id}`).value;
            await updateDoc(doc(db, "orders", id), { adminNote: note }); showToast('Đã lưu Note', '');
        };
        window.deleteOrder = async (id) => { if(confirm("Xóa đơn này khỏi lịch sử?")) await deleteDoc(doc(db, "orders", id)); };

        const renderAdminOrdersList = () => {
            const c = document.getElementById('admin-orders-list');
            c.innerHTML = ordersAndLeads.length === 0 ? '<p class="text-xs text-gray-500">Chưa có đơn hàng.</p>' : '';
            ordersAndLeads.forEach(ord => {
                const isZalo = ord.type === 'ZALO_CONSULT';
                const imgUrl = ord.productImage ? getOptimizedImageUrl(ord.productImage, 150) : '';
                c.insertAdjacentHTML('beforeend', `
                    <div class="p-3 rounded-2xl border border-rose-100 bg-rose-50 flex gap-3">
                        ${imgUrl ? `<img src="${imgUrl}" class="w-20 h-20 rounded-xl object-cover bg-white shrink-0 border border-rose-100">` : ''}
                        <div class="flex-1 min-w-0">
                            <div class="flex items-center justify-between mb-1">
                                <div>
                                    <span class="text-[10px] font-bold ${isZalo ? 'text-blue-600 bg-blue-100' : 'text-emerald-600 bg-emerald-100'} px-2 py-0.5 rounded">${isZalo ? 'Tư vấn' : 'Chốt đơn'}</span>
                                    <span class="text-xs font-bold ml-1">${ord.customerName}</span>
                                </div>
                                <div class="flex gap-1 flex-wrap justify-end max-w-[120px]">
                                    ${ord.status === 'CONFIRMED' ? '<span class="text-[10px] bg-emerald-500 text-white px-2 py-1 rounded font-bold">Đã XN</span>' : ''}
                                    ${(!ord.status || ord.status === 'NEW') ? `<button onclick="window.updateOrderStatus('${ord.id}', 'CONFIRMED')" class="text-[10px] font-bold bg-emerald-500 text-white px-2 py-1 rounded">Xác nhận</button>` : ''}
                                    <button onclick="window.deleteOrder('${ord.id}')" class="text-[10px] bg-red-100 text-red-600 px-2 py-1 rounded font-bold">Xóa</button>
                                </div>
                            </div>
                            <p class="text-xs font-black text-brand-rose my-1">${ord.customerPhone}</p>
                            <p class="text-[11px] text-gray-700 leading-tight">${ord.customerAddress || 'Khách nhắn Zalo'}</p>
                            <p class="text-[11px] font-bold text-gray-800 mt-1 truncate">${ord.productName} - ${formatMoney(ord.totalPrice)}</p>
                            <div class="flex gap-2 mt-2">
                                <input type="text" id="note-${ord.id}" value="${ord.adminNote || ''}" placeholder="Ghi chú (giao hàng, bank...)" class="flex-1 text-[11px] px-2 py-1.5 rounded-lg border border-gray-200 outline-none focus:border-brand-rose">
                                <button onclick="window.updateOrderNote('${ord.id}')" class="text-[10px] font-bold bg-gray-200 hover:bg-gray-300 text-gray-700 px-3 rounded-lg transition">Lưu note</button>
                            </div>
                        </div>
                    </div>`);
            });
        };
    </script>
</body>
</html>
